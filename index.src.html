<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

// Hook: ¿estamos en viewport móvil? (reacciona al rotar/redimensionar)
function useIsMobile(){
  const [m,setM]=useState(()=>typeof window!=='undefined'&&window.matchMedia('(max-width:820px)').matches);
  useEffect(()=>{
    const mq=window.matchMedia('(max-width:820px)');
    const h=e=>setM(e.matches);
    mq.addEventListener?mq.addEventListener('change',h):mq.addListener(h);
    return()=>{mq.removeEventListener?mq.removeEventListener('change',h):mq.removeListener(h);};
  },[]);
  return m;
}

// ─── Constantes ────────────────────────────────────────────────────────────────
const PROFESSORS=[
  {id:'prof_inaki', name:'Iñaki',  color:'#1e3a5f', avatar:'IÑ'},
  {id:'prof_carlos',name:'Carlos', color:'#7c2d8c', avatar:'CA'},
  {id:'prof_maria', name:'María',  color:'#0e6856', avatar:'MA'},
];
const USERS=[
  {id:'admin',      name:'Admin',  role:'admin',    icon:'admin_panel_settings', color:'#fd761a'},
  {id:'prof_inaki', name:'Iñaki',  role:'profesor', icon:'directions_car',       color:'#1e3a5f'},
  {id:'prof_carlos',name:'Carlos', role:'profesor', icon:'directions_car',       color:'#7c2d8c'},
  {id:'prof_maria', name:'María',  role:'profesor', icon:'directions_car',       color:'#0e6856'},
];
const VEHICLES=[
  {id:'v1',name:'Seat Ibiza',    plate:'1234 ABC',type:'B'},
  {id:'v2',name:'Renault Clio',  plate:'5678 DEF',type:'B'},
  {id:'v3',name:'Ford Focus',    plate:'9012 GHI',type:'B'},
];
// Rejilla de 15 min (07:00–21:45): las clases de 45 min encajan exactas
// (09:00, 09:45, 10:30…) y el inicio se puede afinar cada 15 min. Sin desfase.
const mkGrid=(startH,endMin,step)=>{const a=[];for(let m=startH*60;m<=endMin;m+=step)a.push(`${String((m/60|0)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`);return a;};
const TIME_SLOTS=mkGrid(7,21*60+45,15);
// Fecha local YYYY-MM-DD. NO usar date.toISOString() para esto: convierte a UTC
// y en zonas horarias al este (+UTC) devuelve el DÍA ANTERIOR, lo que hacía que
// las clases se pintaran/guardaran corridas un día en el panel.
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

// ── Borrados EXPLÍCITOS del administrador ──────────────────────────────────
// El sync SOLO borra en la nube lo que esté aquí. Antes se deducía: "estaba en
// el último snapshot y ya no está en el estado local ⇒ bórralo". Eso hacía
// desaparecer clases que el bot acababa de reservar y que el panel aún no
// tenía — por deshacer un cambio, o porque el pull actualiza la referencia al
// instante y el estado de React un momento después. Se perdieron 55 clases
// reales así. Una clase solo se borra si alguien pulsa borrar.
const borradosExplicitos = new Set();
const marcarBorrada = id => { if (id) borradosExplicitos.add(id); };
const DAY_NAMES=['Lun','Mar','Mié','Jue','Vie','Sáb'];

const NAMES_INAKI =['Ana García','Luis Martín','Carmen López','Javier Pérez','María Sánchez',
                    'Pedro Ruiz','Laura Torres','Sofía Moreno','Miguel Díaz','Elena Castro'];
const NAMES_CARLOS=['Roberto Jiménez','Natalia Romero','Sergio Navarro','Paula Ortiz','Diego Herrera',
                    'Alicia Flores','Raúl Gómez','Marta Ramos','Antonio Molina','Cristina Reyes'];
const NAMES_MARIA =['Fernando López','Sandra Muñoz','Pablo García','Lucia Fernández','Alberto Ruiz',
                    'Nuria Sánchez','Marcos Pérez','Irene Castro','David Torres','Patricia Vega'];

// ─── Storage ──────────────────────────────────────────────────────────────────
const load=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch{return fb}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

// ─── Config de la autoescuela ─────────────────────────────────────────────────
const DEFAULT_SCHOOL={
  name:'Autoescuela Exit',color:'#fd761a',
  botUrl:'https://autoescuela-bot-production.up.railway.app',
  supabaseUrl:'https://vxpavrtjgvrxqimsemku.supabase.co',
  // anon key: pública por diseño (el acceso real lo controlan RLS + sesiones)
  supabaseAnonKey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4cGF2cnRqZ3ZyeHFpbXNlbWt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDcyNTQsImV4cCI6MjA5ODkyMzI1NH0.zV1G4zZ6an__M45ZDuUAw8kSCxo9_NYV807uD1PAURA',
  schoolId:'4a443e53-2cfd-45df-b360-616d7e309687',
  setupDone:false,
};
const loadSchool=()=>{
  // Mezclar con los defaults: configuraciones antiguas ganan los campos nuevos
  const stored=load('crm_school_v1',{})||{};
  const merged={...DEFAULT_SCHOOL,...stored};
  // Migrar botUrl antiguo de desarrollo local al de producción
  if(merged.botUrl==='http://localhost:3002')merged.botUrl=DEFAULT_SCHOOL.botUrl;
  // Migrar el nombre por defecto antiguo al nuevo
  if(merged.name==='AutoEscuela')merged.name=DEFAULT_SCHOOL.name;
  return merged;
};
const saveSchool=v=>save('crm_school_v1',v);

// ─── Supabase helpers ─────────────────────────────────────────────────────────
let _supabase = null;
function getSupabase() {
  const cfg = loadSchool();
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return null;
  if (!_supabase) {
    _supabase = window.supabase?.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  }
  return _supabase;
}
function resetSupabase() { _supabase = null; }

// ─── Contraseñas (pre-Supabase) ───────────────────────────────────────────────
const DEFAULT_PASSWORDS={admin:'1234'};
const loadPasswords=()=>load('crm_passwords_v1',DEFAULT_PASSWORDS);
const savePasswords=v=>save('crm_passwords_v1',v);

// ─── Seed ─────────────────────────────────────────────────────────────────────
function rnd(arr){return arr[Math.floor(Math.random()*arr.length)];}
function seedStudents(){
  const all=[];
  [[NAMES_INAKI,'prof_inaki'],[NAMES_CARLOS,'prof_carlos'],[NAMES_MARIA,'prof_maria']].forEach(([names,pid],pi)=>{
    names.forEach((name,i)=>{
      all.push({
        id:`stu_${pi*10+i+1}`,name,
        phone:`6${Math.floor(10000000+Math.random()*89999999)}`,
        profId:pid,license:rnd(['B','B','B','A','B']),
        numClases:Math.floor(3+Math.random()*22),
        bono:rnd(['Bono 10','Bono 20','Bono 5','Sin bono']),
        tasasPagadas:Math.random()>0.28,active:true,
      });
    });
  });
  return all;
}
function seedSlots(students){
  const slots={};
  const today=new Date();today.setHours(0,0,0,0);
  for(let d=-10;d<=18;d++){
    const date=new Date(today);date.setDate(today.getDate()+d);
    if(date.getDay()===0)continue;
    const dateStr=ymd(date);
    PROFESSORS.forEach(prof=>{
      const ps=students.filter(s=>s.profId===prof.id&&s.active);
      let count=0;
      const times=[...TIME_SLOTS].sort(()=>Math.random()-.5);
      times.forEach(time=>{
        if(count>=5)return;
        if(Math.random()>0.52)return;
        const stu=rnd(ps); if(!stu)return;
        const veh=rnd(VEHICLES);
        const key=`${dateStr}_${time}_${prof.id}`;
        const isExam=Math.random()<0.12;
        slots[key]={id:key,date:dateStr,time,profId:prof.id,studentId:stu.id,
          vehicleId:veh.id,slotType:isExam?'examen':'practica',
          confirmed:Math.random()>0.35};
        count++;
      });
    });
  }
  return slots;
}
function freshDemo(){
  localStorage.removeItem('crm_students_v3');
  localStorage.removeItem('crm_slots_v4');
  localStorage.removeItem('crm_exam_days_v3');
  localStorage.removeItem('crm_professors_v3');
  localStorage.removeItem('crm_vehicles_v3');
  window.location.reload();
}

const inp="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-200";
const btnO="inline-flex items-center gap-1.5 bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors cursor-pointer";
const btnR="inline-flex items-center gap-1.5 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors cursor-pointer";
const btnG="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold transition-colors cursor-pointer border border-slate-200";

// ─── Modal ────────────────────────────────────────────────────────────────────
function Modal({title,onClose,children,width=500}){
  useEffect(()=>{
    const h=e=>{if(e.key==='Escape')onClose()};
    document.addEventListener('keydown',h);return()=>document.removeEventListener('keydown',h);
  },[]);
  return(
    <div className="fixed inset-0 flex items-center justify-center z-50 fade-in"
      style={{background:'rgba(9,20,38,0.6)',backdropFilter:'blur(4px)',padding:12}} onClick={onClose}>
      <div className="modal-card" style={{background:'#fff',borderRadius:14,boxShadow:'0 32px 80px rgba(9,20,38,0.22)',
        width:'100%',maxWidth:width,maxHeight:'90vh',overflowY:'auto',padding:24}}
        onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-5">
          <h2 style={{fontSize:17,fontWeight:700,color:'#091426'}}>{title}</h2>
          <button onClick={onClose} style={{color:'#94a3b8',lineHeight:1}}><Icon name="close" size={22}/></button>
        </div>
        {children}
      </div>
    </div>
  );
}
const F=({label,children})=>(
  <div className="mb-4">
    <label style={{display:'block',fontSize:11,fontWeight:600,color:'#64748b',marginBottom:4}}>{label}</label>
    {children}
  </div>
);

// ─── LOGIN ────────────────────────────────────────────────────────────────────
// ── Copia local de las clases ──────────────────────────────────────────────
// El navegador guarda una copia completa del horario en localStorage. Si la
// nube pierde clases, esta copia permite recuperarlas. Va en la pantalla de
// login A PROPOSITO: nada mas entrar, el panel descarga de la nube y machaca
// la copia local, asi que hay que sacarla ANTES de iniciar sesion.
// Solo aparece abriendo la web con ?recuperar al final.
function CopiaLocal(){
  const [msg,setMsg]=useState('');
  if(typeof location==='undefined'||!/[?&]recuperar/.test(location.search))return null;
  const leer=()=>{try{return JSON.parse(localStorage.getItem('crm_slots_v4')||'{}')}catch(e){return {}}};
  const n=Object.keys(leer()).length;
  const descargar=()=>{
    const datos=localStorage.getItem('crm_slots_v4')||'{}';
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([datos],{type:'application/json'}));
    a.download=`copia-clases-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setMsg(`Descargado: ${n} clases. Busca el archivo en tu carpeta de Descargas.`);
  };
  return(
    <div onClick={e=>e.stopPropagation()}
      style={{marginTop:18,padding:'14px 16px',borderRadius:10,background:'rgba(255,255,255,.07)',
        border:'1px solid rgba(255,255,255,.15)'}}>
      <div style={{fontSize:13,fontWeight:700,color:'#fff',marginBottom:4}}>Copia local del horario</div>
      <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginBottom:10}}>
        Este ordenador guarda <strong style={{color:'#fff'}}>{n} clases</strong>. Descárgalas sin
        iniciar sesión: al entrar, el panel se sincroniza y esta copia se sustituye.
      </div>
      <button type="button" onClick={descargar} disabled={!n}
        style={{width:'100%',padding:'10px',borderRadius:8,border:'none',cursor:n?'pointer':'not-allowed',
          background:n?'#fd761a':'rgba(255,255,255,.15)',color:'#fff',fontSize:13,fontWeight:700}}>
        {n?'Descargar copia':'Este ordenador no tiene copia'}
      </button>
      {msg&&<div style={{fontSize:12,color:'#4ade80',marginTop:8}}>{msg}</div>}
    </div>
  );
}

function LoginScreen({onLogin, professors}){
  const school=loadSchool();
  const [userId,setUserId]=useState('admin');
  const [pass,setPass]=useState('');
  const [error,setError]=useState('');
  const [showPass,setShowPass]=useState(false);

  // Construir lista de usuarios: admin + profesores activos
  const userList=[
    {id:'admin',name:'Administrador',role:'admin',icon:'admin_panel_settings',color:'#fd761a'},
    ...professors.filter(p=>p.active!==false).map(p=>({
      id:p.id,name:p.name,role:'profesor',icon:'directions_car',color:p.color||'#1e3a5f'
    }))
  ];

  const [checking,setChecking]=useState(false);
  const handleLogin=async e=>{
    e.preventDefault();
    const u=userList.find(x=>x.id===userId);
    if(!u){setError('Selecciona un usuario');return;}
    const sb=getSupabase();
    if(sb){
      // Login contra Supabase (contraseñas hasheadas en la nube)
      setError('');setChecking(true);
      try{
        const {data,error:err}=await sb.rpc('verify_login',{p_user_id:userId,p_password:pass});
        if(err)throw err;
        if(data&&data.length){
          // Guardar el token de sesión (12h) para las RPC de datos
          if(data[0].token)sessionStorage.setItem('crm_token',data[0].token);
          onLogin(u);
        } else {
          setError('Contraseña incorrecta');setPass('');
        }
      }catch(e2){
        setError('Error de conexión: '+(e2.message||'Supabase no responde'));
      }finally{
        setChecking(false);
      }
      return;
    }
    // Sin Supabase: contraseñas locales (modo demo)
    const passwords=loadPasswords();
    const correctPwd=passwords[userId]||'1234';
    if(pass!==correctPwd){setError('Contraseña incorrecta');setPass('');return;}
    setError('');
    onLogin(u);
  };

  const ac=school.color||'#fd761a';
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
      padding:24,background:'linear-gradient(145deg,#091426 0%,#0f2a4a 100%)'}}>
      <div style={{width:'100%',maxWidth:400}}>
        {/* Logo */}
        <div style={{textAlign:'center',marginBottom:36}}>
          <div style={{display:'inline-flex',alignItems:'center',gap:14,marginBottom:10}}>
            <div style={{background:ac,borderRadius:16,padding:14,display:'flex',
              boxShadow:`0 8px 32px ${ac}55`}}>
              <Icon name="directions_car" size={32} style={{color:'#fff'}}/>
            </div>
            <div style={{textAlign:'left'}}>
              <div style={{fontSize:26,fontWeight:800,color:'#fff',letterSpacing:'-.5px'}}>{school.name}</div>
              <div style={{fontSize:12,color:'rgba(255,255,255,.45)',marginTop:3}}>Panel de gestión</div>
            </div>
          </div>
        </div>

function Dashboard({students,slots,professors,user}){
  const isAdmin=user.role==='admin';
  const myStudents=isAdmin?students:students.filter(s=>s.profId===user.id);
  const slotArr=Object.values(slots).filter(s=>isAdmin||s.profId===user.id);
  const today=ymd(new Date());
  const todaySlots=slotArr.filter(s=>s.date===today);
  const now=new Date();
  const wS=new Date(now);wS.setDate(now.getDate()-now.getDay()+1);wS.setHours(0,0,0,0);
  const wE=new Date(wS);wE.setDate(wS.getDate()+6);
  const weekSlots=slotArr.filter(s=>{const d=new Date(s.date);return d>=wS&&d<=wE;});
  const upcoming=slotArr.filter(s=>s.date>=today).sort((a,b)=>a.date+a.time>b.date+b.time?1:-1).slice(0,12);

  const stats=[
    {icon:'school',        label:'Alumnos activos',    value:myStudents.filter(s=>s.active).length,    color:'#1e3a5f',bg:'#dbeafe'},
    {icon:'today',         label:'Clases hoy',          value:todaySlots.length,                        color:'#0e6856',bg:'#d1fae5'},
    {icon:'date_range',    label:'Clases esta semana',  value:weekSlots.length,                         color:'#b45309',bg:'#fef3c7'},
    {icon:'warning',       label:'Tasas pendientes',    value:myStudents.filter(s=>!s.tasasPagadas&&s.active).length, color:'#b91c1c',bg:'#fee2e2'},
  ];

  // ── Copia de seguridad del horario (la genera el bot cada día a las 23:59;
  // guarda SIEMPRE el horario de "la semana que viene", sobrescribiendo la
  // del día anterior) ──
  const [backupMeta,setBackupMeta]=useState(null);   // {backup_date,week_start,week_end,count}
  const [backupLoading,setBackupLoading]=useState(false);
  const [backupMsg,setBackupMsg]=useState('');
  useEffect(()=>{
    if(!isAdmin)return;
    const sb=getSupabase();
    const token=sessionStorage.getItem('crm_token');
    if(!sb||!token)return;
    sb.rpc('crm_get_schedule_backup',{p_token:token}).then(({data,error})=>{
      if(!error&&data)setBackupMeta({backup_date:data.backup_date,week_start:data.week_start,
        week_end:data.week_end,count:(data.slots||[]).length});
    }).catch(()=>{});
  },[isAdmin]);
  const handleDownloadBackup=async()=>{
    const sb=getSupabase();
    const token=sessionStorage.getItem('crm_token');
    if(!sb||!token){setBackupMsg('❌ Conéctate a Supabase para descargar la copia.');return;}
    setBackupLoading(true);setBackupMsg('');
    try{
      const {data,error}=await sb.rpc('crm_get_schedule_backup',{p_token:token});
      if(error)throw error;
      if(!data){setBackupMsg('Aún no hay ninguna copia de seguridad guardada (se genera cada día a las 23:59).');return;}
      const rows=(data.slots||[]).slice().sort((a,b)=>
        (String(a.date)+String(a.time))>(String(b.date)+String(b.time))?1:-1);
      const header='Fecha;Hora;Profesor;Alumno;Tipo;Estado;Duración(min)';
      const lines=rows.map(s=>{
        const prof=professors.find(p=>p.id===(s.prof_id||s.profId));
        const stu=students.find(st=>st.id===(s.student_id||s.studentId));
        const fecha=String(s.date).substring(0,10);
        const hora=String(s.time).substring(0,5);
        const tipo=(s.slot_type||s.slotType)==='examen'?'Examen':'Práctica';
        const estado=s.status==='cancelled'?'Cancelada':s.status==='confirmed'?'Confirmada':'Pendiente';
        const alumno=stu?.name||(s.blocked?'🔒 BLOQUEADO':'—');
        return [fecha,hora,prof?.name||'—',alumno,tipo,estado,s.duration||45].join(';');
      });
      const csv='﻿'+[header,...lines].join('\n'); // BOM: acentos correctos en Excel
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=`horario_semana_${data.week_start}_a_${data.week_end}.csv`;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setBackupMeta({backup_date:data.backup_date,week_start:data.week_start,week_end:data.week_end,count:rows.length});
      setBackupMsg('✅ Descargado');
    }catch(e){
      setBackupMsg('❌ Error: '+(e.message||'desconocido'));
    }finally{
      setBackupLoading(false);
    }
  };

  return(
    <div style={{padding:24,overflowY:'auto',height:'100%'}}>
      <SectionTitle>{isAdmin?'Dashboard — Resumen general':'Mi Panel'}</SectionTitle>
      <div className="stat-grid">
        {stats.map(s=>(
          <Card key={s.label} style={{padding:18}}>
            <div style={{background:s.bg,borderRadius:9,padding:9,display:'inline-flex',marginBottom:10}}>
              <Icon name={s.icon} size={22} style={{color:s.color}}/>
            </div>
            <div style={{fontSize:28,fontWeight:800,color:'#091426',lineHeight:1}}>{s.value}</div>
            <div style={{fontSize:12,color:'#64748b',marginTop:5}}>{s.label}</div>
          </Card>
        ))}
      </div>
      {isAdmin&&(
        <Card style={{marginBottom:18}}>
          <div style={{padding:'14px 18px',display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
            <div style={{background:'#f1f5f9',borderRadius:9,padding:9,display:'inline-flex'}}>
              <Icon name="cloud_download" size={20} style={{color:'#1e3a5f'}}/>
            </div>
            <div style={{flex:1,minWidth:180}}>
              <div style={{fontWeight:600,color:'#091426',fontSize:14}}>Copia de seguridad del horario</div>
              <div style={{fontSize:12,color:'#64748b',marginTop:2}}>
                {backupMeta
                  ? `Última copia: ${backupMeta.backup_date} · semana ${backupMeta.week_start} a ${backupMeta.week_end} · ${backupMeta.count} clases`
                  : 'Se genera automáticamente cada día a las 23:59 (horario de la semana que viene)'}
              </div>
              {backupMsg&&<div style={{fontSize:12,marginTop:3,color:backupMsg.startsWith('❌')?'#b91c1c':'#0e6856'}}>{backupMsg}</div>}
            </div>
            <button onClick={handleDownloadBackup} disabled={backupLoading} className={btnO}>
              <Icon name="download" size={16}/>{backupLoading?'Descargando…':'Descargar'}
            </button>
          </div>
        </Card>
      )}
      <Card>
        <div style={{padding:'14px 18px',borderBottom:'1px solid #f1f5f9',fontWeight:600,color:'#091426',fontSize:14}}>
          Próximas clases
        </div>
        {upcoming.length===0&&<div style={{padding:32,textAlign:'center',color:'#94a3b8'}}>No hay clases próximas</div>}
        {upcoming.map(slot=>{
          const stu=students.find(s=>s.id===slot.studentId);
          const prof=professors.find(p=>p.id===slot.profId);
          return(
            <div key={slot.id} style={{display:'flex',alignItems:'center',gap:12,
              padding:'10px 18px',borderBottom:'1px solid #f8fafc'}}>
              <div style={{width:50,fontSize:11,textAlign:'center',flexShrink:0}}>
                <div style={{fontWeight:700,color:'#091426'}}>{slot.time}</div>
                <div style={{color:'#94a3b8'}}>{slot.date.slice(5).replace('-','/')}</div>
              </div>
              {stu&&<Avatar name={stu.name} color={prof?.color||'#64748b'} size={30}/>}
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,color:'#091426',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{stu?.name||'—'}</div>
                <div style={{fontSize:11,color:'#64748b'}}>{prof?.name}</div>
              </div>
              <Badge label={slot.slotType==='examen'?'Examen':'Práctica'} color={slot.slotType==='examen'?'#7c2d8c':'#1e3a5f'}/>
              <Chip ok={slot.confirmed} label={slot.confirmed?'Confirmado':'Pendiente'}/>
            </div>
          );
        })}
      </Card>
    </div>
  );
}

// Tipos de vehículo con sus iconos y etiquetas
const VEHICLE_TYPES=[
  {id:'manual',     label:'Manual',      icon:'settings',        color:'#1e3a5f'},
  {id:'automatico', label:'Automático',  icon:'auto_mode',       color:'#7c2d8c'},
  {id:'moto',       label:'Moto',        icon:'two_wheeler',     color:'#0e6856'},
  {id:'camion',     label:'Camión',      icon:'local_shipping',  color:'#b45309'},
];
function getVehicleType(id){ return VEHICLE_TYPES.find(v=>v.id===id)||VEHICLE_TYPES[0]; }

// Calcula duración de clase: 45min si mismo tipo vehículo, 60min si cambia
// Helpers de solape (mismo criterio que el bot): una clase ocupa [inicio, inicio+dur).
const hhmmToMin=t=>{const[h,m]=String(t).substring(0,5).split(':').map(Number);return h*60+(m||0);};
const rangesOverlap=(a,ad,b,bd)=>a<b+bd&&b<a+ad;
function wouldClash(slotsObj,exceptId,profId,date,time,dur){
  const a=hhmmToMin(time);
  return Object.values(slotsObj).some(o=>o.id!==exceptId&&o.profId===profId&&o.date===date
    &&o.studentId&&!o.cancelled&&rangesOverlap(a,dur,hhmmToMin(o.time),o.duration||45));
}
function calcDuration(profId, date, time, studentVehicleType, allSlots){
  const slotsArr=Array.isArray(allSlots)?allSlots:Object.values(allSlots||{});
  // Slot anterior de ese profesor ese día (el de la hora anterior)
  const [h,m]=time.split(':').map(Number);
  const prevMins=h*60+m-60; // buscar clase que termine aquí (aprox)
  const daySlots=slotsArr.filter(s=>s.profId===profId&&s.date===date&&s.studentId&&s.status!=='cancelled'&&s.id!=='__new__');
  if(!daySlots.length) return 45;
  // Encontrar slot más cercano anterior
  const prev=daySlots
    .map(s=>{const[sh,sm]=s.time.split(':').map(Number);return{...s,mins:sh*60+sm};})
    .filter(s=>s.mins<h*60+m)
    .sort((a,b)=>b.mins-a.mins)[0];
  if(!prev) return 45;
  return prev.vehicleType===studentVehicleType ? 45 : 60;
}

        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <input type="date" className={inp} style={{flex:1}} value={f.examDate||''} onChange={e=>s('examDate',e.target.value)}/>
          {f.examDate&&(
            <button type="button" onClick={()=>s('examDate','')}
              style={{padding:'5px 10px',borderRadius:7,border:'1px solid #e2e8f0',background:'#fff',color:'#94a3b8',cursor:'pointer',fontSize:12}}>
              Quitar
            </button>
          )}
        </div>

            </p>

        </button>
      </div>
    </Modal>
  );
}

    setSending(s=>({...s,[stu.id]:'sending'}));
    try{
      const r=await fetch(`${botUrl}/api/send-booking/${stu.id}`,{method:'POST',signal:AbortSignal.timeout(5000)});

        setSending(s=>({...s,[stu.id]:'ok'}));

// ─── PROFESORES ───────────────────────────────────────────────────────────────
const PROF_COLORS=['#1e3a5f','#7c2d8c','#0e6856','#b45309','#9f1239','#1d4ed8','#065f46','#7c3aed'];
// Permisos que puede impartir un profesor
// Clasificación DGT de cada carnet según sus exámenes prácticos (tabla oficial
// de la autoescuela): qué pruebas requiere — circuito cerrado (pista) y/o
// circulación. Es la fuente de verdad para las fases de cada alumno.
const LICENSE_EXAMS={
  AM: {pista:true,  circ:false, veh:'Ciclomotor (50cc · 45 km/h)'},
  A1: {pista:true,  circ:true,  veh:'Moto hasta 125cc / 11 kW'},
  A2: {pista:true,  circ:true,  veh:'Moto hasta 35 kW'},
  A:  {pista:true,  circ:true,  veh:'Moto sin límite'},
  B:  {pista:false, circ:true,  veh:'Turismo hasta 3.500 kg'},
  BE: {pista:true,  circ:true,  veh:'B + remolque no ligero'},
  C1: {pista:true,  circ:true,  veh:'Camión 3.500–7.500 kg'},
  C1E:{pista:true,  circ:true,  veh:'C1 + remolque no ligero'},
  C:  {pista:true,  circ:true,  veh:'Camión > 3.500 kg'},
  CE: {pista:true,  circ:true,  veh:'C + remolque no ligero'},
  D1: {pista:true,  circ:true,  veh:'Autobús hasta 16 plazas'},
  D1E:{pista:true,  circ:true,  veh:'D1 + remolque no ligero'},
  D:  {pista:true,  circ:true,  veh:'Autobús > 16 plazas'},
  DE: {pista:true,  circ:true,  veh:'D + remolque no ligero'},
};
const LICENSE_OPTIONS=Object.keys(LICENSE_EXAMS);
// Fases válidas de un carnet, en orden (primero pista cuando aplica).
// El carnet B NO tiene examen de pista → solo circulación.
function licensePhases(lic){
  const e=LICENSE_EXAMS[lic]||LICENSE_EXAMS.B;
  const ph=[];
  if(e.pista)ph.push('pista');
  if(e.circ)ph.push('circulacion');
  return ph.length?ph:['circulacion'];
}
function defaultPhase(lic){return licensePhases(lic)[0];}      // fase recomendada
function licenseExamLabel(lic){
  const ph=licensePhases(lic);
  if(ph.length===2)return 'pista + circulación (primero pista)';
  return ph[0]==='pista'?'solo pista':'solo circulación';
}
// Modo de clase de un profesor según los carnets que imparte (unión de fases).
// Solo B → circulación · solo AM → pista · con más carnets → ambos.
function deriveClassMode(licenses){
  const ls=(licenses||[]).filter(Boolean);
  if(!ls.length)return 'ambos';
  let pista=false, circ=false;
  ls.forEach(l=>{const e=LICENSE_EXAMS[l]; if(e){pista=pista||e.pista; circ=circ||e.circ;}});
  if(pista&&circ)return 'ambos';
  return pista?'pista':'circulacion';
}
const CLASS_MODE_LABEL={circulacion:'Solo circulación',pista:'Solo pista',ambos:'Pista y circulación'};
const CLASS_MODE_COLOR={circulacion:'#0e6856',pista:'#b45309',ambos:'#1d4ed8'};
function ProfModal({prof,vehicles=[],onSave,onClose}){
  const blank={name:'',color:PROF_COLORS[0],phone:'',email:'',licenses:[],classMode:'',vehicleIds:[],schedule:''};
  const [f,setF]=useState(prof?{name:prof.name,color:prof.color,phone:prof.phone||'',email:prof.email||'',
    licenses:prof.licenses||[],classMode:prof.classMode||prof.class_mode||'',
    vehicleIds:(prof.vehicleIds&&prof.vehicleIds.length)?prof.vehicleIds:((prof.vehicleId||prof.vehicle_id)?[prof.vehicleId||prof.vehicle_id]:[]),
    schedule:prof.schedule||''}:blank);
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  // Tipo de clase efectivo: manual si se ha fijado, si no derivado de los permisos
  const effMode=f.classMode||deriveClassMode(f.licenses);
  const toggleLic=(l)=>setF(x=>{
    const has=(x.licenses||[]).includes(l);
    const licenses=has?x.licenses.filter(y=>y!==l):[...(x.licenses||[]),l];
    // Si el modo no se ha tocado manualmente, mantenerlo sincronizado con la regla
    return {...x,licenses,classMode:x.classMode&&x.classMode!==deriveClassMode(x.licenses)?x.classMode:''};
  });
  return(
    <Modal title={prof?'Editar profesor':'Nuevo profesor'} onClose={onClose} width={460}>
      <F label="Nombre completo"><input className={inp} value={f.name} onChange={e=>s('name',e.target.value)} placeholder="Ej: Juan García"/></F>
      <div className="form-2col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <F label="Teléfono"><input className={inp} value={f.phone} onChange={e=>s('phone',e.target.value)} placeholder="+34 600 000 000"/></F>
        <F label="Email"><input className={inp} value={f.email} onChange={e=>s('email',e.target.value)} placeholder="prof@autoescuela.com"/></F>
      </div>
      <F label="Permisos que imparte">
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {LICENSE_OPTIONS.map(l=>{
            const on=(f.licenses||[]).includes(l);
            return(
              <button key={l} type="button" onClick={()=>toggleLic(l)}
                style={{padding:'5px 11px',borderRadius:7,border:'2px solid',cursor:'pointer',fontWeight:700,fontSize:12,
                  borderColor:on?'#1e3a5f':'#e2e8f0',background:on?'#1e3a5f':'#fff',color:on?'#fff':'#64748b'}}>
                {l}
              </button>
            );
          })}
        </div>
      </F>
      <F label="Tipo de clase">
        <select className={inp} value={effMode} onChange={e=>s('classMode',e.target.value)}>
          <option value="circulacion">Solo circulación</option>
          <option value="pista">Solo pista</option>
          <option value="ambos">Pista y circulación</option>
        </select>
        <div style={{fontSize:11,color:'#94a3b8',marginTop:4,display:'flex',alignItems:'center',gap:4}}>
          <Icon name="info" size={12}/>
          {f.classMode&&f.classMode!==deriveClassMode(f.licenses)
            ?'Fijado manualmente (distinto de la regla automática).'
            :`Automático según permisos: ${CLASS_MODE_LABEL[deriveClassMode(f.licenses)]} (solo B → circulación; resto → pista y circulación).`}
        </div>
      </F>
      <div className="form-2col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <F label="Vehículos asignados">
          {vehicles.length===0
            ? <p style={{fontSize:12,color:'#94a3b8'}}>No hay vehículos. Créalos en la pestaña Vehículos.</p>
            : <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {vehicles.map(v=>{
                  const on=(f.vehicleIds||[]).includes(v.id);
                  return(<button key={v.id} type="button"
                    onClick={()=>setF(x=>{const has=(x.vehicleIds||[]).includes(v.id);

function getWeek(offset=0){
  const d=new Date();
  d.setDate(d.getDate()-d.getDay()+1+offset*7);d.setHours(0,0,0,0);
  return Array.from({length:6},(_,i)=>{const dd=new Date(d);dd.setDate(d.getDate()+i);return dd;});
}

function Horario({slots,setSlots,students,vehicles,professors,user,examDays,setExamDays,onAccionesMasivas}){
  const isAdmin=user.role==='admin';
  const [off,setOff]=useState(0);
  const [vProf,setVProf]=useState(isAdmin?'all':user.id);
  const [fType,setFType]=useState('all');
  const [adding,setAdding]=useState(null);
  const [editing,setEditing]=useState(null);
  const week=getWeek(off);
  const today=ymd(new Date());
  const visProfs=vProf==='all'?professors:professors.filter(p=>p.id===vProf);

  const toggleExam=d=>{if(!isAdmin)return;setExamDays(ds=>ds.includes(d)?ds.filter(x=>x!==d):[...ds,d]);};
  // ── DESHACER: guarda el estado del horario ANTES de cada cambio, para poder
  // revertir si algo se hace mal (borrados, acciones masivas, mover, crear…).
  const undoStack=useRef([]);
  const [canUndo,setCanUndo]=useState(false);
  const pushUndo=()=>{undoStack.current.push(slots);if(undoStack.current.length>25)undoStack.current.shift();setCanUndo(true);};
  const undo=()=>{if(!undoStack.current.length)return;setSlots(undoStack.current.pop());setCanUndo(undoStack.current.length>0);};
  const saveSlot=f=>{if(!confirmaSiFueraDeSemana(f.date))return;pushUndo();const k=`${f.date}_${f.time}_${f.profId}`;setSlots(ss=>({...ss,[k]:{...f,id:k}}));setAdding(null);setEditing(null);};
  // Avisa al alumno por WhatsApp (vía el bot) de que su clase se ha cancelado.
  // Acepta una clase suelta o el bloque entero de una clase doble, para avisar
  // UNA sola vez y con el rango real ("de 11:00 a 12:30").
  const notifyCancel=async(slOrChain)=>{
    const chain=Array.isArray(slOrChain)?slOrChain:[slOrChain];
    const first=chain[0];
    if(!first||!first.studentId)return;
    const stu=students.find(s=>s.id===first.studentId);
    const url=(loadSchool().botUrl||'').replace(/\/$/,'');
    if(!stu||!url)return;
    const last=chain[chain.length-1];
    const dayName=new Date(first.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
    const end=minToHHMM(hhmmToMin(last.time)+(last.duration||45));
    try{
      await fetch(`${url}/api/notify-cancel`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({studentId:stu.id,name:stu.name,date:first.date,time:first.time,end,dayName}),
        signal:AbortSignal.timeout(6000)});
    }catch(e){/* si el bot no responde, la clase se borra igual */}
  };
  // Avisa al alumno de que su clase se ha MOVIDO a otra hora/día.
  // ── Clases dobles ────────────────────────────────────────────────────────
  // Una clase doble (90 min) NO es un registro: son dos clases de 45 pegadas
  // del mismo alumno. Aquí se reconstruye ese bloque a partir de una de ellas,
  // para poder moverlo entero y avisar de la hora real de inicio y de fin.
  const minToHHMM=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  // ── Tope "solo hasta la semana que viene" ────────────────────────────────
  // El bot nunca ofrece más allá del sábado de la semana siguiente, pero
  // creando a mano en el CRM no había ningún control y aparecían clases
  // sueltas semanas después. Aquí se avisa (no se prohíbe: el admin manda).
  const topeSemanaQueViene=()=>{
    const hoy=new Date(),dw=hoy.getDay(),diff=dw===0?1:8-dw;
    const lun=new Date(hoy);lun.setDate(hoy.getDate()+diff);lun.setHours(0,0,0,0);
    const sab=new Date(lun);sab.setDate(lun.getDate()+5);
    return ymd(sab);
  };
  const confirmaSiFueraDeSemana=date=>{
    const tope=topeSemanaQueViene();
    if(String(date).substring(0,10)<=tope)return true;
    return window.confirm(`⚠️ Esa fecha va más allá de la semana que viene (tope: ${tope}).\n\nEl bot solo reserva hasta ahí. ¿Crear la clase de todas formas?`);
  };
  const blockOf=sl=>{
    if(!sl||!sl.studentId)return sl?[sl]:[];
    const same=Object.values(slots).filter(s=>s.id!==sl.id&&s.studentId===sl.studentId
      &&s.profId===sl.profId&&s.date===sl.date&&s.slotType===sl.slotType);
    const chain=[sl];
    for(;;){ // hacia atrás: una clase que termine justo donde empieza la primera
      const ini=hhmmToMin(chain[0].time);
      const prev=same.find(s=>!chain.includes(s)&&hhmmToMin(s.time)+(s.duration||45)===ini);
      if(!prev)break; chain.unshift(prev);
    }
    for(;;){ // hacia delante: una clase que empiece justo donde acaba la última
      const last=chain[chain.length-1];
      const fin=hhmmToMin(last.time)+(last.duration||45);
      const next=same.find(s=>!chain.includes(s)&&hhmmToMin(s.time)===fin);
      if(!next)break; chain.push(next);
    }
    return chain;
  };
  // Aviso de cambio de horario: envía SIEMPRE inicio y fin, de forma que una
  // clase doble se comunique como "de 11:00 a 12:30" y no como dos avisos.
  const notifyMove=async(chain,newDate,newTimes)=>{
    const first=chain&&chain[0];
    if(!first||!first.studentId)return;
    const stu=students.find(s=>s.id===first.studentId);
    const url=(loadSchool().botUrl||'').replace(/\/$/,'');
    if(!stu||!url)return;
    const dn=d=>new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
    const last=chain[chain.length-1];
    const durLast=last.duration||45;
    const oldTime=String(first.time).substring(0,5);
    const oldEnd=minToHHMM(hhmmToMin(last.time)+durLast);
    const newTime=newTimes[0];
    const newEnd=minToHHMM(hhmmToMin(newTimes[newTimes.length-1])+durLast);
    try{
      await fetch(`${url}/api/notify-move`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({studentId:stu.id,name:stu.name,
          oldDate:first.date,oldTime,oldEnd,oldDayName:dn(first.date),
          newDate,newTime,newEnd,newDayName:dn(newDate)}),
        signal:AbortSignal.timeout(6000)});
    }catch(e){/* si el bot no responde, la clase se mueve igual */}
  };
  const delSlot=id=>{
    const sl=slots[id]; if(!sl)return;
    // Una clase doble son dos registros pegados: si se borra solo uno, el
    // profesor se queda con un hueco fantasma y el alumno recibe el aviso de
    // la mitad que no es. Se borra el bloque entero.
    const chain=blockOf(sl);
    if(chain.length>1){
      const mins=chain.reduce((a,s)=>a+(s.duration||45),0);
      if(!window.confirm(`Es una clase doble de ${mins} min (${String(chain[0].time).substring(0,5)}–${minToHHMM(hhmmToMin(chain[chain.length-1].time)+(chain[chain.length-1].duration||45))}). ¿Se borra entera?`))return;
    }
    if(sl.studentId){
      const stu=students.find(s=>s.id===sl.studentId);
      if(window.confirm(`¿Avisar a ${stu?.name||'el alumno'} por WhatsApp de que esta clase se cancela?`)) notifyCancel(chain);
    }
    pushUndo();
    setSlots(ss=>{const n={...ss};chain.forEach(s=>{marcarBorrada(s.id);delete n[s.id];});return n;});setEditing(null);
  };
  // Mover una clase (arrastrar) a otra hora/día/profesor, estilo Google Calendar.
  // Comprueba el solape antes de mover. Las clases del bot conservan su id.
  const moveSlot=(slotId,date,time,profId)=>{
    const sl=slots[slotId]; if(!sl)return;
    if(sl.date===date&&sl.time===time&&sl.profId===profId)return;
    // Si es una clase doble, se mueve el bloque ENTERO manteniendo las dos
    // mitades seguidas: antes se arrastraba solo una y la clase quedaba partida.
    if(!confirmaSiFueraDeSemana(date))return;
    const chain=blockOf(sl);
    const desfase=hhmmToMin(time)-hhmmToMin(sl.time);
    const movidas=chain.map(s=>({...s,_newTime:minToHHMM(hhmmToMin(s.time)+desfase)}));
    // El solape se comprueba contra las clases que NO son de este bloque
    const idsBloque=new Set(chain.map(s=>s.id));
    const resto={};Object.values(slots).forEach(s=>{if(!idsBloque.has(s.id))resto[s.id]=s;});
    for(const m of movidas){
      const min=hhmmToMin(m._newTime);
      if(min<0||min+(m.duration||45)>24*60){
        alert('⚠️ La clase no cabe a esa hora.');return;
      }
      if(wouldClash(resto,m.id,profId,date,m._newTime,m.duration||45)){
        alert(chain.length>1
          ? '⚠️ La clase doble no cabe ahí: alguna de sus dos horas se solapa con otra clase del profesor.'
          : '⚠️ Esa hora se solapa con otra clase de ese profesor.');
        return;
      }
    }
    if(sl.studentId){
      const stu=students.find(s=>s.id===sl.studentId);
      const dobleTxt=chain.length>1?` (clase doble de ${chain.reduce((a,s)=>a+(s.duration||45),0)} min)`:'';
      if(window.confirm(`¿Avisar a ${stu?.name||'el alumno'} por WhatsApp de que su clase${dobleTxt} se mueve a otra hora?`))
        notifyMove(chain,date,movidas.map(m=>m._newTime));
    }
    pushUndo();
    setSlots(ss=>{
      const n={...ss};
      movidas.forEach((m,i)=>{
        const orig=n[m.id]; if(!orig)return;
        const nuevo={...orig,date,time:m._newTime,profId};
        if(orig.fromBot){ n[m.id]=nuevo; }
        else { marcarBorrada(m.id); delete n[m.id]; const nid=`slot_${Date.now()}_${i}_${Math.random().toString(36).slice(2,6)}`; n[nid]={...nuevo,id:nid}; }
      });
      return n;
    });
  };
  // ── Acciones masivas: seleccionar varias clases y operarlas de golpe ──
  const [selMode,setSelMode]=useState(false);
  const [sel,setSel]=useState(()=>new Set());
  const toggleSel=id=>setSel(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const clearSel=()=>setSel(new Set());
  const exitSel=()=>{setSelMode(false);clearSel();};
  const bulkDelete=()=>{
    if(!sel.size)return;
    if(!window.confirm(`¿Borrar ${sel.size} clase(s) seleccionada(s)?`))return;
    const conAlumno=[...sel].map(id=>slots[id]).filter(s=>s&&s.studentId);
    // Agrupar por bloque: si se seleccionan las dos mitades de una clase doble
    // hay que mandar UN aviso con el rango, no dos avisos sueltos.
    const bloques=[];const vistos=new Set();
    conAlumno.forEach(sl=>{
      if(vistos.has(sl.id))return;
      const ch=blockOf(sl).filter(s=>sel.has(s.id));
      const bloque=ch.length?ch:[sl];
      bloque.forEach(s=>vistos.add(s.id));
      bloques.push(bloque);
    });
    if(bloques.length&&window.confirm(`¿Avisar por WhatsApp a ${bloques.length} alumno(s)/clase(s) de que se cancelan?`)){
      bloques.forEach(b=>notifyCancel(b));
    }
    pushUndo();
    setSlots(ss=>{const n={...ss};sel.forEach(id=>{marcarBorrada(id);delete n[id];});return n;});
    exitSel();
  };
  const bulkConfirm=val=>{
    if(!sel.size)return;
    pushUndo();
    setSlots(ss=>{const n={...ss};sel.forEach(id=>{if(n[id])n[id]={...n[id],confirmed:val};});return n;});
    clearSel();
  };
  // Edición masiva del TIPO de clase (examen / práctica) de las seleccionadas.
  const bulkType=t=>{
    if(!sel.size)return;
    pushUndo();
    setSlots(ss=>{const n={...ss};sel.forEach(id=>{if(n[id])n[id]={...n[id],slotType:t};});return n;});
    clearSel();
  };

  const exportSchedule=()=>{
    const profsToExport=vProf==='all'?professors:professors.filter(p=>p.id===vProf);
    const weekLabel=`${week[0].toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${week[5].toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}`;
    const genLabel=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const DAY_FULL=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    const dayKeys=week.map(d=>ymd(d));
    const examCol=dayKeys.map(ds=>examDays.includes(ds));
    const filterLabel=fType==='practica'?' · Solo prácticas':fType==='examen'?' · Solo exámenes':'';
    const vehBadge=vt=>vt==='automatico'
        ?'<span style="background:#7c3aed;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:middle;-webkit-print-color-adjust:exact;print-color-adjust:exact">AUT</span>'
       :vt==='moto'?'<span style="font-size:11px;margin-left:4px">🛵</span>'
       :vt==='camion'?'<span style="font-size:11px;margin-left:4px">🚛</span>':'';

    const tables=profsToExport.map(prof=>{
      // Clases reales de este profesor esta semana (sin canceladas ni huecos vacíos).
      // Respeta el filtro Prácticas/Exámenes de la pantalla: lo que ves = lo que imprimes.
      const profSlots=Object.values(slots).filter(sl=>
        sl.profId===prof.id && sl.studentId && sl.status!=='cancelled' && dayKeys.includes(sl.date)
        && (fType==='all' || sl.slotType===fType));
      // Solo las filas de hora con alguna clase → hoja compacta (no 60 filas vacías)
      const activeTimes=TIME_SLOTS.filter(t=>profSlots.some(sl=>sl.time===t));

      const header=`
        <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1e3a5f;padding-bottom:10px;margin-bottom:14px">
          <div>
            <div style="font-size:22px;font-weight:800;color:#091426;letter-spacing:-.3px">Horario — ${prof.name}</div>
            <div style="font-size:13px;color:#475569;margin-top:3px">Semana del ${weekLabel}${filterLabel}</div>
          </div>
          <div style="font-size:11px;color:#94a3b8;text-align:right">Generado el ${genLabel}</div>
        </div>`;

      if(!activeTimes.length){
        return `<div class="page">${header}
          <div style="padding:44px;text-align:center;color:#94a3b8;font-size:14px;border:1px dashed #cbd5e1;border-radius:10px">
            Sin clases programadas esta semana.
          </div></div>`;
      }

      const headCells=DAY_FULL.map((d,i)=>`
        <th style="padding:7px 8px;text-align:left;font-size:12px;background:#f1f5f9;width:15%;border:1px solid #e2e8f0">
          <div style="text-transform:uppercase;letter-spacing:.4px;font-size:10px;color:#64748b">${d}</div>
          <div style="font-size:15px;font-weight:800;color:#091426">${week[i].getDate()}</div>
          ${examCol[i]?'<div style="font-size:9px;font-weight:700;color:#c2410c;background:#ffedd5;border-radius:4px;padding:1px 5px;display:inline-block;margin-top:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact">📝 EXAMEN</div>':''}
        </th>`).join('');

      const rows=activeTimes.map(time=>{
        const cells=dayKeys.map((ds,di)=>{
          const daySl=profSlots.filter(sl=>sl.date===ds&&sl.time===time);
          if(!daySl.length)
            return `<td style="border:1px solid #e2e8f0;padding:3px;vertical-align:top${examCol[di]?';background:#fff7ed':''}"></td>`;
          const boxes=daySl.map(sl=>{
            const stu=students.find(x=>x.id===sl.studentId);
            const label=stu?.name||'?';
            const vt=stu?.vehicleType||'manual';
            const dur=sl.duration||(stu?calcDuration(sl.profId,sl.date,sl.time,stu.vehicleType,slots):45);
            const bg=sl.slotType==='examen'?'#581c87':'#1e3a8a';
            return `<div style="background:${bg};color:#fff;border-radius:5px;padding:4px 7px;margin-bottom:3px;font-size:11px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact">
              <span style="font-weight:700;line-height:1.25;word-break:break-word">${label}${vehBadge(vt)}</span>
              <span style="opacity:.75;white-space:nowrap;font-variant-numeric:tabular-nums">${dur}′</span>
            </div>`;
          }).join('');
          return `<td style="border:1px solid #e2e8f0;padding:3px;vertical-align:top">${boxes}</td>`;
        }).join('');
        return `<tr>
          <td style="border:1px solid #e2e8f0;color:#475569;font-size:11px;font-weight:600;white-space:nowrap;padding:4px 9px;text-align:right;background:#f8fafc;vertical-align:middle;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact">${time}</td>
          ${cells}
        </tr>`;
      }).join('');

      return `<div class="page">
        ${header}
        <table style="width:100%;border-collapse:collapse;table-layout:fixed">
          <thead><tr>
            <th style="padding:7px 8px;background:#f1f5f9;width:10%;border:1px solid #e2e8f0"></th>
            ${headCells}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }).join('');

    const html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Horario — ${profsToExport.length===1?profsToExport[0].name:'Semanal'}</title>
      <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{background:#fff}
        body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#0f172a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
        .page{padding:22px 26px}
        .page + .page{page-break-before:always}
        table{border-collapse:collapse}
        thead{display:table-header-group}
        tr{break-inside:avoid;page-break-inside:avoid}
        @media print{@page{size:A4 landscape;margin:11mm}}
      </style></head><body>${tables||'<div class="page">Sin profesores.</div>'}
      <script>window.onload=()=>window.print()<\/script></body></html>`;

    const w=window.open('','_blank');
    if(!w){alert('Permite las ventanas emergentes para poder exportar el horario.');return;}
    w.document.write(html);
    w.document.close();
  };

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      {/* toolbar */}
      <div style={{padding:'10px 16px',borderBottom:'1px solid #e2e8f0',display:'flex',
        alignItems:'center',gap:8,flexShrink:0,flexWrap:'wrap',background:'#fff'}}>
        <span style={{fontWeight:700,fontSize:15,color:'#091426'}}>Horario</span>
        <button onClick={()=>setOff(o=>o-1)} style={{border:'none',background:'none',cursor:'pointer',color:'#64748b',display:'flex'}}><Icon name="chevron_left" size={22}/></button>
        <span style={{fontSize:13,color:'#475569',minWidth:210,textAlign:'center'}}>
          {week[0].toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – {week[5].toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}
        </span>
        <button onClick={()=>setOff(o=>o+1)} style={{border:'none',background:'none',cursor:'pointer',color:'#64748b',display:'flex'}}><Icon name="chevron_right" size={22}/></button>
        <button onClick={()=>setOff(0)} style={{fontSize:12,color:'#fd761a',background:'none',border:'none',cursor:'pointer',fontWeight:600}}>Hoy</button>
        <div style={{flex:1}}/>
        {isAdmin&&(
          <select className={inp} style={{width:175}} value={vProf} onChange={e=>setVProf(e.target.value)}>
            <option value="all">Todos los profesores</option>
            {professors.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        )}
        <select className={inp} style={{width:130}} value={fType} onChange={e=>setFType(e.target.value)}>
          <option value="all">Todo</option>
          <option value="practica">Prácticas</option>
          <option value="examen">Exámenes</option>
        </select>
        <button onClick={exportSchedule}
          style={{display:'flex',alignItems:'center',gap:5,padding:'5px 11px',borderRadius:7,border:'1px solid #e2e8f0',
            background:'#fff',color:'#475569',fontSize:12,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',transition:'all .15s'}}
          onMouseEnter={e=>{e.currentTarget.style.background='#f8faff';e.currentTarget.style.borderColor='#94a3b8';}}
          onMouseLeave={e=>{e.currentTarget.style.background='#fff';e.currentTarget.style.borderColor='#e2e8f0';}}>
          <Icon name="print" size={16}/>Exportar PDF
        </button>
        {isAdmin&&onAccionesMasivas&&(
          <button onClick={onAccionesMasivas}
            title="Bloquear o liberar un rango de fechas y horas de una vez"
            style={{display:'flex',alignItems:'center',gap:5,padding:'5px 11px',borderRadius:7,border:'1px solid #cbd5e1',
              background:'#f8fafc',color:'#16283f',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>
            <Icon name="event_busy" size={16}/>Acciones masivas
          </button>
        )}
        {isAdmin&&(
          <button onClick={()=>selMode?exitSel():setSelMode(true)}
            style={{display:'flex',alignItems:'center',gap:5,padding:'5px 11px',borderRadius:7,border:'1px solid',
              background:selMode?'#fef2f2':'#fff',color:selMode?'#dc2626':'#475569',
              borderColor:selMode?'#fecaca':'#e2e8f0',fontSize:12,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
            <Icon name={selMode?'close':'checklist'} size={16}/>{selMode?'Salir':'Seleccionar'}
          </button>
        )}
        {isAdmin&&(
          <button onClick={undo} disabled={!canUndo} title="Revierte el último cambio del horario"
            style={{display:'flex',alignItems:'center',gap:5,padding:'5px 11px',borderRadius:7,border:'1px solid #e2e8f0',
              background:canUndo?'#fff':'#f8fafc',color:canUndo?'#b45309':'#cbd5e1',
              fontSize:12,fontWeight:600,cursor:canUndo?'pointer':'not-allowed',whiteSpace:'nowrap'}}>
            <Icon name="undo" size={16}/>Deshacer
          </button>
        )}
      </div>
      {/* barra de acciones masivas */}
      {selMode&&(
        <div style={{padding:'8px 16px',display:'flex',alignItems:'center',gap:8,flexShrink:0,flexWrap:'wrap',
          background:'#eff6ff',borderBottom:'1px solid #dbeafe',fontSize:13}}>
          <span style={{fontWeight:700,color:'#1e3a8a'}}>{sel.size} seleccionada(s)</span>
          {[{l:'🗑 Borrar',fn:bulkDelete,c:'#dc2626',bg:'#fef2f2',bc:'#fecaca'},
            {l:'✅ Confirmar',fn:()=>bulkConfirm(true),c:'#0e6856',bg:'#f0fdf4',bc:'#bbf7d0'},
            {l:'⏳ Pendiente',fn:()=>bulkConfirm(false),c:'#b45309',bg:'#fffbeb',bc:'#fde68a'},
            {l:'📝 Examen',fn:()=>bulkType('examen'),c:'#581c87',bg:'#faf5ff',bc:'#e9d5ff'},
            {l:'🚗 Práctica',fn:()=>bulkType('practica'),c:'#1e3a8a',bg:'#eff6ff',bc:'#bfdbfe'},
            {l:'Deseleccionar',fn:clearSel,c:'#475569',bg:'#fff',bc:'#e2e8f0'}].map(b=>(
            <button key={b.l} onClick={b.fn} disabled={!sel.size}
              style={{padding:'5px 11px',borderRadius:7,border:'1px solid '+b.bc,background:b.bg,color:b.c,
                fontSize:12,fontWeight:600,cursor:sel.size?'pointer':'not-allowed',opacity:sel.size?1:.5}}>{b.l}</button>
          ))}
          <span style={{color:'#64748b',fontSize:12}}>Toca las clases para seleccionarlas.</span>
        </div>
      )}
      {/* leyenda */}
      <div style={{padding:'5px 16px',display:'flex',gap:16,fontSize:11,color:'#94a3b8',
        flexShrink:0,borderBottom:'1px solid #f1f5f9',background:'#fafbff'}}>
        <span style={{display:'flex',alignItems:'center',gap:4}}>
          <span style={{width:10,height:10,borderRadius:2,background:'#1e3a8a',display:'inline-block'}}/>Práctica
        </span>
        <span style={{display:'flex',alignItems:'center',gap:4}}>
          <span style={{width:10,height:10,borderRadius:2,background:'#581c87',display:'inline-block'}}/>Examen
        </span>
        {isAdmin&&<span style={{display:'flex',alignItems:'center',gap:4,color:'#b45309'}}>
          <Icon name="touch_app" size={12}/>Clic en cabecera del día para reservar día de examen
        </span>}
        {isAdmin&&<span style={{display:'flex',alignItems:'center',gap:4,color:'#1d4ed8'}}>
          <Icon name="drag_indicator" size={12}/>Arrastra una clase para moverla de hora/día/profesor
        </span>}
      </div>
      {/* grid */}
      <div style={{overflow:'auto',flex:1,padding:'8px 12px'}}>
        <table style={{borderCollapse:'collapse',minWidth:820}}>
          <thead>
            <tr>
              <th style={{width:54,padding:'4px 6px',color:'#94a3b8',fontSize:11,fontWeight:500}}></th>
              {week.map((d,di)=>{
                const ds=ymd(d);
                const isExam=examDays.includes(ds);
                const isToday=ds===today;
                const cs=vProf==='all'?visProfs.length:1;
                return(
                  <th key={di} colSpan={cs} style={{padding:'3px 2px',minWidth:cs*90}}>
                    <div onClick={()=>toggleExam(ds)}
                      style={{borderRadius:8,padding:'5px 8px',cursor:isAdmin?'pointer':'default',
                        background:isExam?'#fff7ed':isToday?'#eff6ff':'transparent',
                        border:isExam?'1.5px dashed #f97316':isToday?'1.5px solid #3b82f6':'1.5px solid transparent',
                        transition:'background .15s'}}>
                      <div style={{fontSize:10,color:'#94a3b8',fontWeight:500}}>{DAY_NAMES[di]}</div>
                      <div style={{fontSize:14,fontWeight:800,color:isToday?'#2563eb':isExam?'#c2410c':'#091426'}}>{d.getDate()}</div>
                      {isExam&&<div style={{fontSize:9,color:'#ea580c',fontWeight:700}}>EXAMEN</div>}
                    </div>
                  </th>
                );
              })}
            </tr>
            {vProf==='all'&&(
              <tr>
                <th/>
                {week.map((_,di)=>visProfs.map(prof=>(
                  <th key={`sh_${di}_${prof.id}`} style={{padding:'2px 2px',fontSize:10}}>
                    <span style={{color:prof.color,fontWeight:700}}>{prof.name}</span>
                  </th>
                )))}
              </tr>
            )}
          </thead>
          <tbody>
            {TIME_SLOTS.map(time=>(
              <tr key={time} style={{borderTop:'1px solid #f1f5f9'}}>
                <td style={{padding:'2px 6px',fontSize:10,color:'#94a3b8',verticalAlign:'top',whiteSpace:'nowrap'}}>{time}</td>
                {week.map((d,di)=>{
                  const ds=ymd(d);
                  const isExam=examDays.includes(ds);
                  return visProfs.map(prof=>{
                    const cs=Object.values(slots).filter(s=>s.date===ds&&s.time===time&&s.profId===prof.id&&(fType==='all'||s.slotType===fType));
                    return(
                      <td key={`${di}_${prof.id}`} style={{padding:2,verticalAlign:'top',width:90}}
                        onDragOver={e=>{if(isAdmin&&!isExam&&!selMode)e.preventDefault();}}
                        onDrop={e=>{if(!isAdmin||selMode||isExam)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(id)moveSlot(id,ds,time,prof.id);}}>
                        {isExam?(
                          <div style={{height:38,borderRadius:5,background:'#fff7ed',
                            border:'1px dashed #fed7aa',display:'flex',alignItems:'center',justifyContent:'center'}}>
                            <Icon name="event_busy" size={14} style={{color:'#f97316'}}/>
                          </div>
                        ):(
                          <>
                            {cs.map(slot=>{
                              const stu=students.find(s=>s.id===slot.studentId);
                              const isPrac=slot.slotType!=='examen';
                              const isAuto=stu?.vehicleType==='automatico';
                              const isMoto=stu?.vehicleType==='moto';
                              const dur=slot.duration||(stu?calcDuration(slot.profId,slot.date,slot.time,stu.vehicleType,slots):45);
                              return(
                                <div key={slot.id} className="slot-card"
                                  draggable={isAdmin&&!selMode}
                                  onDragStart={e=>{e.dataTransfer.setData('text/plain',slot.id);e.dataTransfer.effectAllowed='move';}}
                                  onClick={()=>selMode?toggleSel(slot.id):setEditing(slot)}
                                  style={{background:slot.blocked?'#475569':isPrac?'#1e3a8a':'#581c87',
                                    borderLeft:`3px solid ${slot.blocked?'#94a3b8':isPrac?'#93c5fd':'#c084fc'}`,position:'relative',
                                    outline:selMode&&sel.has(slot.id)?'2px solid #38bdf8':'none',
                                    outlineOffset:1,opacity:selMode&&!sel.has(slot.id)?.55:1}}>
                                  {selMode&&sel.has(slot.id)&&<div style={{position:'absolute',top:1,right:2,fontSize:10}}>✓</div>}
                                  <div style={{display:'flex',alignItems:'center',gap:3}}>
                                    <div style={{fontSize:10,fontWeight:600,color:'#f1f5f9',
                                      overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>
                                      {slot.blocked?<><Icon name="lock" size={9} style={{verticalAlign:-1}}/> Bloqueado</>:(stu?.name||'?')}
                                    </div>
                                    {isAuto&&<span style={{fontSize:8,fontWeight:800,background:'#a855f7',color:'#fff',padding:'0 3px',borderRadius:2,flexShrink:0}}>A</span>}
                                    {isMoto&&<Icon name="two_wheeler" size={9} style={{color:'#6ee7b7',flexShrink:0}}/>}
                                  </div>
                                  <div style={{fontSize:9,color:'rgba(255,255,255,.6)',display:'flex',justifyContent:'space-between'}}>
                                    <span>{slot.blocked?'—':(slot.confirmed?'✓':'…')} {isPrac?'Práct.':'Exam.'}</span>
                                    <span style={{color:dur===60?'#fcd34d':'rgba(255,255,255,.5)'}}>{dur}′</span>
                                  </div>
                                </div>
                              );
                            })}
                            {isAdmin&&cs.length===0&&(
                              <div onClick={()=>setAdding({date:ds,time,profId:prof.id})}
                                style={{height:34,border:'1px dashed #e2e8f0',borderRadius:5,
                                  display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'border .15s'}}
                                onMouseEnter={e=>e.currentTarget.style.borderColor='#94a3b8'}
                                onMouseLeave={e=>e.currentTarget.style.borderColor='#e2e8f0'}>
                                <Icon name="add" size={13} style={{color:'#cbd5e1'}}/>
                              </div>
                            )}
                          </>
                        )}
                      </td>
                    );
                  });
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {adding&&<Modal title="Nueva clase" onClose={()=>setAdding(null)}>
        <SlotForm slot={adding} students={students} vehicles={vehicles} professors={professors} isAdmin={isAdmin} onSave={saveSlot} onClose={()=>setAdding(null)}/>
      </Modal>}
      {editing&&<Modal title="Detalle de clase" onClose={()=>setEditing(null)}>
        <SlotForm slot={editing} students={students} vehicles={vehicles} professors={professors} isAdmin={isAdmin} onSave={saveSlot} onClose={()=>setEditing(null)}/>
        {isAdmin&&<div style={{marginTop:16,paddingTop:16,borderTop:'1px solid #f1f5f9'}}>
          <button onClick={()=>delSlot(editing.id)} className={btnR}><Icon name="delete" size={17}/>Eliminar clase</button>
        </div>}
      </Modal>}
    </div>
  );
}

// ─── MENSAJES + BOT SIMULATOR ─────────────────────────────────────────────────
function BotSim({students,slots,professors}){
  const allStudents=students.filter(s=>s.active);
  const [stuId,setStuId]=useState(allStudents[0]?.id||'');
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState('');
  const [phase,setPhase]=useState('idle'); // idle | activo | fin
  const simRef=useRef({free:[],idx:0,booked:[],cancelMode:false});
  const ref=useRef();

  const stu=students.find(s=>s.id===stuId);
  const prof=professors.find(p=>p.id===stu?.profId);
  const school=loadSchool();

  useEffect(()=>{ref.current&&(ref.current.scrollTop=ref.current.scrollHeight);},[msgs]);

  const resetSim=()=>{setMsgs([]);setPhase('idle');setInput('');simRef.current={free:[],idx:0,booked:[],cancelMode:false};};

  // Huecos libres de la semana que viene (mismo cálculo que el bot real)
  const computeFree=()=>{
    const profId=stu?.profId;
    const avail=load('crm_avail_v1',{})||{};
    const dayKeys=['lun','mar','mie','jue','vie','sab'];
    const DL=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const now=new Date();
    const mon=new Date(now);mon.setDate(now.getDate()+(now.getDay()===0?1:8-now.getDay()));
    const taken=new Set(Object.values(slots).filter(s=>s.profId===profId&&!s.cancelled).map(s=>`${s.date}_${s.time}`));
    const free=[];
    for(let i=0;i<6;i++){
      const d=new Date(mon);d.setDate(mon.getDate()+i);
      const pad=n=>String(n).padStart(2,'0');
      const ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      const hours=(avail[profId]?.[dayKeys[i]]?.length?avail[profId][dayKeys[i]]
        :['09:00','10:00','11:00','12:00','16:00','17:00','18:00','19:00']).slice().sort();
      hours.forEach(h=>{if(!taken.has(`${ds}_${h}`))free.push({date:ds,time:h,dayName:DL[d.getDay()]});});
    }
    return free;
  };
  const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const fmt=s=>`${s.dayName} ${parseInt(s.date.slice(8))} de ${MESES[parseInt(s.date.slice(5,7))-1]} a las ${s.time}h`;
  const propose=s=>`📅 *${fmt(s)}*\n\n¿Te viene bien? Responde *SÍ*, *NO*, un número (ej: *3*), o pregúntame ("¿el martes a las 10?")`;

  const startBot=()=>{
    if(!stu){setMsgs([{from:'bot',text:'Selecciona un alumno.'}]);return;}
    const free=computeFree();
    simRef.current={free,idx:0,booked:[],cancelMode:false};
    if(!free.length){setMsgs([{from:'bot',text:'No hay huecos disponibles la semana que viene. Contacta con la autoescuela.'}]);return;}
    setMsgs([{from:'bot',text:
      `Hola ${stu.name.split(' ')[0]} 👋 Soy el asistente de *${school.name}*.\n\n`+
      `Vamos a organizar tus clases de la semana que viene. Te propongo:\n\n${propose(free[0])}\n\n⚠️ El plazo cierra el jueves.`}]);
    setPhase('activo');
  };

  // Réplica de la lógica del bot real (visual, no modifica datos)
  const botReply=(text)=>{
    const S=simRef.current;
    const t=text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
    const resumen=()=>S.booked.map(b=>`• ${fmt(b)}`).join('\n');

    if(/listo|gracias|nada mas|fin|suficiente/.test(t)){
      setPhase('fin');
      return S.booked.length
        ?`¡Perfecto ${stu.name.split(' ')[0]}!\n\n📋 *Tus clases de la semana:*\n${resumen()}\n\nTe recordaré cada una 48h antes. 🚗`
        :`¡Perfecto! Escríbeme cuando quieras reservar. 👋`;
    }
    if(S.cancelMode){
      const n=parseInt(t);
      S.cancelMode=false;
      if(n>=1&&n<=S.booked.length){
        const rm=S.booked.splice(n-1,1)[0];
        S.free.push(rm);S.free.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
        return `❌ Clase cancelada: *${fmt(rm)}*\n\nHe avisado a ${prof?.name||'tu profesor'}. 👋`;
      }
    }
    if(/cancelar|anula/.test(t)){
      if(!S.booked.length)return 'No tienes clases reservadas que cancelar 👍';
      S.cancelMode=true;
      return `Estas son tus clases:\n\n${S.booked.map((b,i)=>`*${i+1}.* ${fmt(b)}`).join('\n')}\n\n¿Cuál cancelo? Responde con el número, o *listo* para salir.`;
    }
    if(/clases tengo|mis clases|ver clases/.test(t)){
      return S.booked.length?`📋 *Tus próximas clases:*\n${resumen()}\n\nSi quieres anular alguna, responde *cancelar*.`:'No tienes clases reservadas todavía.';
    }
    const multi=t.match(/^([1-6])$/)||t.match(/\b([1-6])\s*clases?\b/);
    if(multi){
      const n=parseInt(multi[1]);
      const byDate={};S.free.forEach(s=>{(byDate[s.date]=byDate[s.date]||[]).push(s);});
      const dates=Object.keys(byDate).sort();
      const picked=[];
      for(let r=0;picked.length<n&&r<8;r++){
        let added=false;
        for(const d of dates){if(picked.length>=n)break;if(byDate[d][r]){picked.push(byDate[d][r]);added=true;}}
        if(!added)break;
      }
      picked.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
      picked.forEach(p3=>{S.booked.push(p3);S.free=S.free.filter(f=>f!==p3);});
      S.idx=0;
      return `✅ ¡Hechas! He reservado tus ${picked.length} clases:\n\n📋 *Tus clases de la semana:*\n${resumen()}\n\n¿Quieres alguna más? *SÍ*, otro número, o *listo*.`;
    }
    if(/^(si$|si |vale|ok|claro|perfecto|confirmo)/.test(t)){
      const cur=S.free[S.idx];
      if(!cur)return 'No quedan huecos libres esta semana. 📞';
      S.booked.push(cur);S.free=S.free.filter(f=>f!==cur);S.idx=0;
      return `✅ ¡Reservada!\n\n📋 *Tus clases de la semana:*\n${resumen()}\n\n¿Quieres otra? *SÍ* para el siguiente hueco, un número, o *listo* para terminar.`;
    }
    if(/^no/.test(t)){
      S.idx=(S.idx+1)%(S.free.length||1);
      const nx=S.free[S.idx];
      if(!nx)return 'No quedan más huecos disponibles. 📞';
      return `De acuerdo, te propongo:\n\n${propose(nx)}`;
    }
    // Pregunta por día/hora
    const dias={lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6};
    let dow=null;for(const[k,v]of Object.entries(dias)){if(t.includes(k)){dow=v;break;}}
    const hm=t.match(/(\d{1,2}):(\d{2})/)||t.match(/las\s+(\d{1,2})/)||(dow?t.match(/\b(\d{1,2})\b/):null);
    const hour=hm?String(hm[1]).padStart(2,'0')+':'+(hm[2]||'00'):null;
    if(dow||hour){
      const match=S.free.find(s=>{
        const d=new Date(s.date+'T12:00:00').getDay();
        return (!dow||d===dow)&&(!hour||s.time===hour);
      });
      if(match){
        S.free=[match,...S.free.filter(f=>f!==match)];S.idx=0;
        return `✅ ¡Está libre!\n\n${propose(match)}`;
      }
      const cur=S.free[S.idx]||S.free[0];
      return cur?`❌ Ese hueco *no está disponible*.\n\nEl siguiente libre es:\n${propose(cur)}`:'No quedan huecos esta semana. 📞';
    }
    return `Responde *SÍ*, *NO*, un número (ej: *3*), *cancelar*, *"¿qué clases tengo?"*, o pregunta por una hora ("¿el martes a las 10?") 😊`;
  };

  const send=(text)=>{
    const userMsg=(text||'').trim();
    if(!userMsg||phase!=='activo')return;
    setMsgs(m=>[...m,{from:'user',text:userMsg}]);
    setInput('');
    setTimeout(()=>{setMsgs(m=>[...m,{from:'bot',text:botReply(userMsg)}]);},700);
  };
  const sendMsg=()=>send(input);

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',gap:16}}>
      <Card style={{padding:16}}>
        <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <Icon name="smart_toy" size={22} style={{color:'#1e3a5f'}}/>
          <span style={{fontWeight:600,color:'#091426',fontSize:14}}>Simulador del bot WhatsApp</span>
          <span style={{fontSize:12,color:'#64748b'}}>— Simula exactamente lo que verá el alumno en su móvil</span>
          <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
            <select className={inp} style={{width:200}} value={stuId} onChange={e=>{setStuId(e.target.value);resetSim();}}>
              {allStudents.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <button onClick={resetSim} className={btnG} style={{whiteSpace:'nowrap'}}><Icon name="refresh" size={16}/>Reset</button>
            <button onClick={startBot} className={btnO} style={{whiteSpace:'nowrap'}}><Icon name="send" size={16}/>Iniciar bot</button>
          </div>
        </div>
      </Card>

      <div className="sim-split" style={{display:'flex',gap:16,flex:1,minHeight:0}}>
        {/* Chat */}
        <div className="sim-chat" style={{flex:1,display:'flex',flexDirection:'column',borderRadius:12,
          border:'1px solid #e2e8f0',overflow:'hidden',background:'#fff'}}>
          <div style={{background:'#075e54',padding:'12px 16px',display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:38,height:38,borderRadius:'50%',background:'#128c7e',
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:19}}>
              🚗
            </div>
            <div>
              <div style={{fontWeight:600,color:'#fff',fontSize:14}}>{loadSchool().name}</div>
              <div style={{fontSize:11,color:'rgba(255,255,255,.7)'}}>Bot WhatsApp · {stu?.name||'selecciona alumno'}</div>
            </div>
          </div>
          <div className="chat-area" ref={ref} style={{flex:1}}>
            {msgs.length===0&&(
              <div style={{textAlign:'center',color:'#94a3b8',marginTop:40}}>
                <Icon name="chat_bubble_outline" size={40} style={{marginBottom:8}}/>
                <div style={{fontSize:13}}>Pulsa "Iniciar bot" para ver la conversación</div>
              </div>
            )}
            {msgs.map((m,i)=>(
              <div key={i} style={{display:'flex',justifyContent:m.from==='bot'?'flex-start':'flex-end'}}>
                <div className={m.from==='bot'?'bubble-bot':'bubble-user'}
                  style={{whiteSpace:'pre-line'}}>{m.text}</div>
              </div>
            ))}
          </div>
          {phase==='activo'&&(
            <div style={{padding:'10px 12px',borderTop:'1px solid #e2e8f0',display:'flex',gap:8}}>
              <input className={inp} value={input} onChange={e=>setInput(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&sendMsg()}
                placeholder='Escribe SÍ, NO, 3, cancelar, "¿el martes a las 10?"…' style={{flex:1}}/>
              <button onClick={sendMsg} className={btnO}><Icon name="send" size={17}/></button>
            </div>
          )}
          {phase==='activo'&&(
            <div style={{padding:'8px 12px',display:'flex',gap:6,borderTop:'1px solid #f1f5f9',flexWrap:'wrap'}}>
              <button onClick={()=>send('SÍ')}
                style={{flex:1,minWidth:70,padding:'8px',borderRadius:8,border:'1px solid #86efac',
                  background:'#dcfce7',color:'#166534',fontWeight:700,cursor:'pointer',fontSize:13}}>
                ✅ SÍ
              </button>
              <button onClick={()=>send('NO')}
                style={{flex:1,minWidth:70,padding:'8px',borderRadius:8,border:'1px solid #fca5a5',
                  background:'#fee2e2',color:'#991b1b',fontWeight:700,cursor:'pointer',fontSize:13}}>
                ❌ NO
              </button>
              <button onClick={()=>send('3')}
                style={{flex:1,minWidth:70,padding:'8px',borderRadius:8,border:'1px solid #93c5fd',
                  background:'#dbeafe',color:'#1e40af',fontWeight:700,cursor:'pointer',fontSize:13}}>
                🗓 3 clases
              </button>
              <button onClick={()=>send('listo')}
                style={{flex:1,minWidth:70,padding:'8px',borderRadius:8,border:'1px solid #e2e8f0',
                  background:'#f8fafc',color:'#475569',fontWeight:700,cursor:'pointer',fontSize:13}}>
                🏁 Listo
              </button>
            </div>
          )}
        </div>
        {/* Flujo info */}
        <div className="sim-side" style={{width:260,display:'flex',flexDirection:'column',gap:12}}>
          <Card style={{padding:16}}>
            <div style={{fontWeight:600,color:'#091426',fontSize:13,marginBottom:12}}>Flujo automático</div>
            {[
              {day:'Martes 9:00',txt:'El bot escribe a todos los alumnos activos para organizar la semana siguiente',icon:'schedule',c:'#1e3a5f'},
              {day:'Mié–Jue 9:00',txt:'Persigue solo a quienes aún no han reservado (cero spam)',icon:'notification_important',c:'#b45309'},
              {day:'SÍ / número',txt:'Reserva 1 clase o varias de golpe ("3" = 3 clases repartidas)',icon:'check_circle',c:'#0e6856'},
              {day:'Preguntas',txt:'"¿El martes a las 10 está libre?" · "¿qué clases tengo?" · "cancelar"',icon:'forum',c:'#7c2d8c'},
              {day:'Jue 23:59',txt:'Cierra el plazo de reservas de la semana',icon:'lock_clock',c:'#b91c1c'},
              {day:'48h antes',txt:'Recordatorio automático de cada clase',icon:'notifications',c:'#0369a1'},
            ].map(({day,txt,icon,c})=>(
              <div key={day} style={{display:'flex',gap:8,marginBottom:10,alignItems:'flex-start'}}>
                <Icon name={icon} size={16} style={{color:c,flexShrink:0,marginTop:1}}/>
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:c}}>{day}</div>
                  <div style={{fontSize:11,color:'#64748b',lineHeight:1.4}}>{txt}</div>
                </div>
              </div>
            ))}
          </Card>
          <Card style={{padding:16}}>
            <div style={{fontWeight:600,color:'#091426',fontSize:13,marginBottom:8}}>Estado alumno seleccionado</div>
            {stu?(
              <div style={{fontSize:12,color:'#475569'}}>
                <div style={{display:'flex',gap:8,marginBottom:6,alignItems:'center'}}>
                  <Avatar name={stu.name} color={prof?.color||'#64748b'} size={28}/>
                  <div>
                    <div style={{fontWeight:600,color:'#091426'}}>{stu.name}</div>
                    <div style={{color:'#94a3b8'}}>{prof?.name}</div>
                  </div>
                </div>
                <div>Reservadas en esta simulación: <strong>{simRef.current.booked.length}</strong></div>
                <div>Teléfono: <strong>{stu.phone}</strong></div>
              </div>
            ):<div style={{fontSize:12,color:'#94a3b8'}}>Selecciona un alumno</div>}
          </Card>
        </div>
      </div>
    </div>
  );
}

function Mensajes({students,slots,professors,user}){
  const isAdmin=user.role==='admin';
  const [tab,setTab]=useState('confirmaciones');
  const today=new Date();
  const dow=today.getDay();
  const isWindow=dow>=2&&dow<=4;
  const nWS=new Date(today);nWS.setDate(today.getDate()+(8-dow));nWS.setHours(0,0,0,0);
  const nWE=new Date(nWS);nWE.setDate(nWS.getDate()+5);
  const slotArr=Object.values(slots).filter(s=>isAdmin||s.profId===user.id);
  const nwSlots=slotArr.filter(s=>{const d=new Date(s.date);return d>=nWS&&d<=nWE;});
  const pending=nwSlots.filter(s=>!s.confirmed);
  const in48=new Date(today.getTime()+48*3600*1000);
  const reminders=slotArr.filter(s=>{const dt=new Date(`${s.date}T${s.time}:00`);return dt>=today&&dt<=in48;});
  const wa=(phone,msg)=>`https://wa.me/34${phone}?text=${encodeURIComponent(msg)}`;

  // ── Historial de conversaciones (mensajes reales del bot) ──
  const [convos,setConvos]=useState([]);
  const [chatPhone,setChatPhone]=useState(null);
  const [chatMsgs,setChatMsgs]=useState([]);
  const [convLoading,setConvLoading]=useState(false);
  const last9=p=>(p||'').replace(/\D/g,'').slice(-9);
  const stuByPhone=ph=>students.find(s=>last9(s.phone)===last9(ph));
  const loadConvos=async()=>{
    const sb=getSupabase(),tk=sessionStorage.getItem('crm_token');
    if(!sb||!tk){setConvos([]);return;}
    setConvLoading(true);
    try{const {data,error}=await sb.rpc('crm_messages',{p_token:tk});if(error)throw error;setConvos(Array.isArray(data)?data:[]);}
    catch(e){setConvos([]);}
    setConvLoading(false);
  };
  const openChat=async ph=>{
    setChatPhone(ph);setChatMsgs([]);
    const sb=getSupabase(),tk=sessionStorage.getItem('crm_token');
    if(!sb||!tk)return;
    try{const {data,error}=await sb.rpc('crm_messages',{p_token:tk,p_phone:ph});if(error)throw error;setChatMsgs(Array.isArray(data)?data:[]);}
    catch(e){setChatMsgs([]);}
  };
  useEffect(()=>{ if(tab==='conversaciones'&&!chatPhone) loadConvos(); },[tab]);

  const tabs=[
