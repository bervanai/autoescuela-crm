const AVAIL_HOURS=mkGrid(7,21*60+45,15);  // 15 min: encaja con clases de 45 min (sin desfase)
const AVAIL_DAYS=[{key:'lun',label:'Lunes'},{key:'mar',label:'Martes'},{key:'mie',label:'Miércoles'},
  {key:'jue',label:'Jueves'},{key:'vie',label:'Viernes'},{key:'sab',label:'Sábado'}];

function defaultAvail(){
  const a={};
  PROFESSORS.forEach(p=>{
    a[p.id]={};
    AVAIL_DAYS.forEach(d=>{
      a[p.id][d.key]=d.key==='sab'?[]:['09:00','10:00','11:00','16:00','17:00','18:00'];
    });
  });
  return a;
}

function Disponibilidad({user,professors,students,slots,setSlots,abrirMasivas}){
  // Con Supabase, la nube es la fuente: empezar vacío y esperar al pull
  const [avail,setAvail]=useState(()=>load('crm_avail_v1',null)||(getSupabase()?{}:defaultAvail()));
  const [blocked,setBlocked]=useState(()=>load('crm_blocked_v1',{}));
  const [pistaHrs,setPistaHrs]=useState(()=>load('crm_pista_hours_v1',{})||{});
  const [pistaMsg,setPistaMsg]=useState('');
  const lastEdit=useRef(0);

  // Guardar horario de pista en la nube (nivel escuela)
  const togglePista=(day,hour)=>{
    lastEdit.current=Date.now();
    setPistaHrs(prev=>{
      const cur=prev[day]||[];
      const next=cur.includes(hour)?cur.filter(h=>h!==hour):[...cur,hour].sort();
      const upd={...prev,[day]:next};
      save('crm_pista_hours_v1',upd);
      const sb=getSupabase(),tk=sessionStorage.getItem('crm_token');
      if(sb&&tk){
        sb.rpc('crm_set_pista_hours',{p_token:tk,p_hours:upd})
          .then(({error})=>setPistaMsg(error?'❌ '+error.message:'✅ Guardado en la nube'))
          .catch(e=>setPistaMsg('❌ '+e.message));
        setTimeout(()=>setPistaMsg(''),2000);
      }
      return upd;
    });
  };

  // Refrescar cuando el pull de la nube actualiza localStorage (multi-dispositivo)
  const fromPull=useRef(false);
  useEffect(()=>{
    const h=()=>{
      if(Date.now()-lastEdit.current<8000)return; // no pisar una edición en curso
      const a=load('crm_avail_v1',{})||{};
      const b=load('crm_blocked_v1',{})||{};
      setAvail(prev=>{
        if(JSON.stringify(prev)===JSON.stringify(a))return prev;
        fromPull.current=true;return a;
      });
      setBlocked(prev=>{
        if(JSON.stringify(prev)===JSON.stringify(b))return prev;
        fromPull.current=true;return b;
      });
      const ph=load('crm_pista_hours_v1',{})||{};
      setPistaHrs(prev=>JSON.stringify(prev)===JSON.stringify(ph)?prev:ph);
    };
    window.addEventListener('cloud-pull',h);
    return()=>window.removeEventListener('cloud-pull',h);
  },[]);
  const [selProf,setSelProf]=useState(user.role==='profesor'?user.id:professors[0]?.id);
  const [tab,setTab]=useState('disponibilidad'); // 'disponibilidad' | 'bloquear'
  const [saved,setSaved]=useState(false);

  useEffect(()=>save('crm_avail_v1',avail),[avail]);
  useEffect(()=>save('crm_blocked_v1',blocked),[blocked]);

  const isAdmin=user.role==='admin';
  const viewProf=isAdmin?selProf:user.id;
  const prof=professors.find(p=>p.id===viewProf)||professors[0];

  // ── Disponibilidad semanal ─────────────────────────
  function toggle(day,hour){
    lastEdit.current=Date.now();
    setAvail(prev=>{
      const cur=(prev[viewProf]?.[day])||[];
      const next=cur.includes(hour)?cur.filter(h=>h!==hour):[...cur,hour].sort();
      return {...prev,[viewProf]:{...prev[viewProf],[day]:next}};
    });
    setSaved(false);
  }
  function setDay(day,on){
    lastEdit.current=Date.now();
    setAvail(prev=>({...prev,[viewProf]:{...prev[viewProf],[day]:on?[...AVAIL_HOURS]:[]}}));
    setSaved(false);
  }

  // ── Bloquear hora semana siguiente ────────────────
  // nextWeek dates (Lun-Sáb)
  function getNextWeekDates(){
    const now=new Date();const dow=now.getDay();
    const diff=dow===0?1:8-dow;
    const mon=new Date(now);mon.setDate(now.getDate()+diff);mon.setHours(0,0,0,0);
    return [0,1,2,3,4,5].map(i=>{
      const d=new Date(mon);d.setDate(mon.getDate()+i);
      const ds=ymd(d);
      return {date:ds,label:['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][i]};
    });
  }
  const nextWeek=getNextWeekDates();

  function toggleBlock(date,hour){
    const key=`${viewProf}_${date}_${hour}`;
    const yaBloqueada=!!blocked[key];
    // Si esa hora choca con una clase, se avisa al alumno y se cancela: el
    // admin decide, y ninguna hora se queda a medias.
    if(!yaBloqueada){
      const afectadas=clasesQueChocan([date],[hour]);
      if(afectadas.length){
        const stu=(students||[]).find(x=>x.id===afectadas[0][0].studentId);
        if(!window.confirm(
          `Esa hora choca con la clase de ${stu?stu.name:'un alumno'} ` +
          `(${horasBloque(afectadas[0])}).\n\n` +
          `Se CANCELARÁ y se le avisará por WhatsApp. ¿Continuar?`)) return;
        cancelaBloques(afectadas);
      }
    }
    lastEdit.current=Date.now();
    setBlocked(prev=>{
      const next={...prev};
      if(next[key]) delete next[key];
      else next[key]={profId:viewProf,date,hour,blockedAt:Date.now()};
      return next;
    });
    setSaved(false);
  }
  function isBlocked(date,hour){
    return !!blocked[`${viewProf}_${date}_${hour}`];
  }
  // ── Bloqueo por RANGO de horas y por DÍA entero ──────────────────────────
  // Antes había que ir hora por hora (la rejilla es de 15 min: 60 casillas por
  // día). Con esto se marca "de 9:00 a 15:00" de una vez, en un día o en toda
  // la semana. Ninguna hora se queda sin bloquear: si hay clases dentro, se
  // avisa al alumno de la cancelación (con su horario) y se quitan.
  const [rangoDia,setRangoDia]=useState('todos');
  const [rangoIni,setRangoIni]=useState('09:00');
  const [rangoFin,setRangoFin]=useState('15:00');
  const minHHMM=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  function horasDelRango(ini,fin){
    const a=hhmmToMin(ini),b=hhmmToMin(fin);
    const lo=Math.min(a,b),hi=Math.max(a,b);
    // El "hasta" es la hora a la que el profesor VUELVE: bloquear de 9:00 a
    // 15:00 deja libre la clase que empieza a las 15:00, igual que se entiende
    // al hablar. La de 14:45 sí queda bloqueada, porque acabaría a las 15:30.
    if(lo===hi) return AVAIL_HOURS.filter(h=>hhmmToMin(h)===lo);
    return AVAIL_HOURS.filter(h=>{const m=hhmmToMin(h);return m>=lo&&m<hi;});
  }
  // Avisa al alumno de que su clase se cancela. Manda inicio y fin para que una
  // clase doble se entienda ("de 11:00 a 12:30") en vez de parecer media.
  const avisaCancelada=async(bloque)=>{
    const first=bloque[0]; if(!first||!first.studentId)return;
    const stu=(students||[]).find(s=>s.id===first.studentId);
    const url=(loadSchool().botUrl||'').replace(/\/$/,'');
    if(!stu||!url)return;
    const last=bloque[bloque.length-1];
    const fin=minHHMM(hhmmToMin(last.time)+(last.duration||45));
    const dayName=new Date(first.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
    try{
      await fetch(`${url}/api/notify-cancel`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({studentId:stu.id,name:stu.name,date:first.date,
          time:String(first.time).substring(0,5),end:fin,dayName}),
        signal:AbortSignal.timeout(6000)});
    }catch(e){/* si el bot no responde, la clase se cancela igual */}
  };
  // "11:00 → 12:30" (una doble se lee entera, no como dos clases sueltas)
  const horasBloque=b=>{
    const last=b[b.length-1];
    return `${String(b[0].time).substring(0,5)} → ${minHHMM(hhmmToMin(last.time)+(last.duration||45))}`;
  };
  // Cancela los bloques afectados: un aviso por clase (doble incluida) y fuera
  // del horario. Se borran DESPUÉS de avisar, con los datos ya leídos.
  const cancelaBloques=bloques=>{
    bloques.forEach(b=>avisaCancelada(b));
    const ids=new Set(bloques.flat().map(s=>s.id));
    setSlots(ss=>{const n={...ss};ids.forEach(id=>{marcarBorrada(id);delete n[id];});return n;});
  };
  // Una clase doble son DOS clases de 45 min seguidas del mismo alumno. Esto
  // las junta para tratarlas como una sola: se cancela entera y se avisa una
  // vez ("de 11:00 a 12:30"), no media clase ni dos mensajes.
  function bloqueDe(sl,arr){
    if(!sl||!sl.studentId)return sl?[sl]:[];
    const same=arr.filter(s=>s.id!==sl.id&&s.studentId===sl.studentId
      &&s.profId===sl.profId&&s.date===sl.date&&s.slotType===sl.slotType&&s.status!=='cancelled');
    const chain=[sl];
    for(;;){
      const ini=hhmmToMin(chain[0].time);
      const prev=same.find(s=>!chain.includes(s)&&hhmmToMin(s.time)+(s.duration||45)===ini);
      if(!prev)break; chain.unshift(prev);
    }
    for(;;){
      const last=chain[chain.length-1];
      const fin=hhmmToMin(last.time)+(last.duration||45);
      const next=same.find(s=>!chain.includes(s)&&hhmmToMin(s.time)===fin);
      if(!next)break; chain.push(next);
    }
    return chain;
  }
  // Clases con alumno que CHOCAN con el rango (incluidas las que lo invaden
  // por delante: una de 08:45 termina a las 09:30 y pisa un bloqueo de 09:00).
  // Devuelve BLOQUES: si media clase doble entra en el rango, cae la doble
  // entera, porque no puede quedarse a medias.
  function clasesQueChocan(dias,horas,profes){
    const quien=new Set(profes&&profes.length?profes:[viewProf]);
    const set=new Set(horas);
    const arr=(Array.isArray(slots)?slots:Object.values(slots||{}))
      .filter(s=>s&&s.id&&quien.has(s.profId)&&s.status!=='cancelled');
    const tocadas=arr.filter(s=>{
      if(!s.studentId)return false;
      if(!dias.includes(s.date))return false;
      const ini=hhmmToMin(s.time),dur=s.duration||45;
      for(let m=ini;m<ini+dur;m+=15){ if(set.has(minHHMM(m)))return true; }
      return false;
    });
    const vistos=new Set(),bloques=[];
    tocadas.forEach(s=>{
      if(vistos.has(s.id))return;
      const chain=bloqueDe(s,arr);
      chain.forEach(x=>vistos.add(x.id));
      bloques.push(chain);
    });
    return bloques.sort((a,b)=>(a[0].date+a[0].time).localeCompare(b[0].date+b[0].time));
  }
  function aplicarRango(bloquear){
    const horas=horasDelRango(rangoIni,rangoFin);
    const dias=rangoDia==='todos'?nextWeek.map(w=>w.date):[rangoDia];
    if(!horas.length){alert('Ese rango no incluye ninguna hora.');return;}

    if(bloquear){
      // Si hay clases dentro, NO se dejan sin bloquear: se cancelan y se avisa
      // al alumno, que es lo que decide el admin desde aquí.
      const afectadas=clasesQueChocan(dias,horas);
      if(afectadas.length){
        const lista=afectadas.slice(0,10).map(b=>{
          const stu=(students||[]).find(x=>x.id===b[0].studentId);
          return `• ${b[0].date.slice(8)}/${b[0].date.slice(5,7)}  ${horasBloque(b)}  ${stu?stu.name:'(alumno)'}`;
        }).join('\n');
        if(!window.confirm(
          `Hay ${afectadas.length} clase(s) con alumno en ese rango:\n\n${lista}` +
          (afectadas.length>10?`\n… y ${afectadas.length-10} más`:'') +
          `\n\nSe CANCELARÁN y se avisará a cada alumno por WhatsApp.\n\n` +
          `Si prefieres moverlas de hora en vez de cancelarlas, hazlo antes desde el Horario ` +
          `(al arrastrarlas se avisa al alumno con el nuevo horario).\n\n¿Continuar?`)) return;
        cancelaBloques(afectadas);
      }
    }

    lastEdit.current=Date.now();
    setBlocked(prev=>{
      const next={...prev};
      dias.forEach(date=>horas.forEach(hour=>{
        const key=`${viewProf}_${date}_${hour}`;
        if(bloquear) next[key]={profId:viewProf,date,hour,blockedAt:Date.now()};
        else delete next[key];
      }));
      return next;
    });
    setSaved(false);
  }
  // ── ACCIONES MASIVAS ─────────────────────────────────────────────────────
  // El rango de arriba solo llega a la semana que viene y a un profesor. Esto
  // hace lo mismo pero de golpe: un rango de FECHAS cualquiera, filtrando por
  // días de la semana, y para un profesor o para toda la autoescuela.
  const [masivasOpen,setMasivasOpen]=useState(false);
  const [mAccion,setMAccion]=useState('bloquear');   // 'bloquear' | 'liberar'
  const [mQuien,setMQuien]=useState('todos');        // 'todos' | id de profesor
  const [mDesdeDia,setMDesdeDia]=useState(()=>nextWeek[0]?.date||ymd(new Date()));
  const [mHastaDia,setMHastaDia]=useState(()=>nextWeek[nextWeek.length-1]?.date||ymd(new Date()));
  const [mDesdeHora,setMDesdeHora]=useState('09:00');
  const [mHastaHora,setMHastaHora]=useState('15:00');
  const [mDias,setMDias]=useState([]);               // vacío = todos los del rango
  const [mAplicando,setMAplicando]=useState(false);
  // El botón del Horario nos manda aquí: abrir el modal y poner la pestaña
  useEffect(()=>{ if(abrirMasivas){ setTab('bloquear'); setMasivasOpen(true); } },[abrirMasivas]);
  const DIAS_SEMANA=[['Lunes',1],['Martes',2],['Miércoles',3],['Jueves',4],['Viernes',5],['Sábado',6],['Domingo',0]];
  const fechaCorta=d=>{const x=new Date(d+'T12:00:00');
    return isNaN(x)?d:x.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});};
  const lbl={fontSize:10,color:'#94a3b8',fontWeight:700,marginBottom:4,letterSpacing:'.04em'};

  // Todas las fechas del rango que caen en los días de la semana marcados
  function fechasDelRango(desde,hasta,dows){
    const out=[];
    const a=new Date(desde+'T12:00:00'),b=new Date(hasta+'T12:00:00');
    if(isNaN(a)||isNaN(b)||a>b)return out;
    for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){
      if(dows.length&&!dows.includes(d.getDay()))continue;
      out.push(ymd(d));
      if(out.length>400)break;   // tope de seguridad (~14 meses)
    }
    return out;
  }
  const profesoresAfectados=()=>mQuien==='todos'
    ? (professors||[]).map(p=>p.id)
    : [mQuien];

  async function aplicarMasivas(){
    const dias=fechasDelRango(mDesdeDia,mHastaDia,mDias);
    const horas=horasDelRango(mDesdeHora,mHastaHora);
    const profes=profesoresAfectados();
    if(!dias.length){alert('Ese rango de fechas no incluye ningún día. Revisa las fechas y los días de la semana marcados.');return;}
    if(!horas.length){alert('Ese rango de horas no incluye ninguna hora.');return;}
    if(!profes.length){alert('No hay profesores a los que aplicarlo.');return;}

    const nCasillas=dias.length*horas.length*profes.length;
    const quienTxt=mQuien==='todos'
      ? `los ${profes.length} profesores`
      : `${(professors.find(p=>p.id===mQuien)||{}).name||'ese profesor'}`;
    const cuandoTxt=`del ${fechaCorta(dias[0])} al ${fechaCorta(dias[dias.length-1])}, de ${mDesdeHora} a ${mHastaHora}`;

    if(mAccion==='liberar'){
      if(!window.confirm(`Liberar ${nCasillas} casilla(s) para ${quienTxt} ${cuandoTxt}.\n\n¿Continuar?`))return;
      setMAplicando(true);
      lastEdit.current=Date.now();
      setBlocked(prev=>{
        const n={...prev};
        profes.forEach(pid=>dias.forEach(date=>horas.forEach(hour=>{delete n[`${pid}_${date}_${hour}`];})));
        return n;
      });
      setSaved(false);setMAplicando(false);setMasivasOpen(false);
      return;
    }

    // Bloquear: las clases que caigan dentro se cancelan y se avisa al alumno
    const afectadas=clasesQueChocan(dias,horas,profes);
    if(afectadas.length){
      const lista=afectadas.slice(0,12).map(b=>{
        const stu=(students||[]).find(x=>x.id===b[0].studentId);
        const pr=(professors||[]).find(p=>p.id===b[0].profId);
        return `• ${fechaCorta(b[0].date)}  ${horasBloque(b)}  ${stu?stu.name:'(alumno)'}${pr?`  · ${pr.name}`:''}`;
      }).join('\n');
      if(!window.confirm(
        `Vas a bloquear ${nCasillas} casilla(s) para ${quienTxt} ${cuandoTxt}.\n\n` +
        `Hay ${afectadas.length} clase(s) con alumno dentro:\n\n${lista}` +
        (afectadas.length>12?`\n… y ${afectadas.length-12} más`:'') +
        `\n\nSe CANCELARÁN y se avisará a cada alumno por WhatsApp.\n\n` +
        `Si prefieres moverlas de hora, hazlo antes desde el Horario ` +
        `(al moverlas allí se avisa al alumno con el horario nuevo).\n\n¿Continuar?`)) return;
    } else if(!window.confirm(`Bloquear ${nCasillas} casilla(s) para ${quienTxt} ${cuandoTxt}.\n\nNo hay ninguna clase dentro. ¿Continuar?`)) return;

    setMAplicando(true);
    if(afectadas.length) cancelaBloques(afectadas);
    lastEdit.current=Date.now();
    setBlocked(prev=>{
      const n={...prev};
      profes.forEach(pid=>dias.forEach(date=>horas.forEach(hour=>{
        n[`${pid}_${date}_${hour}`]={profId:pid,date,hour,blockedAt:Date.now()};
      })));
      return n;
    });
    setSaved(false);setMAplicando(false);setMasivasOpen(false);
  }

  // Día entero: mismo criterio que el rango. Si hay clases dentro se cancelan
  // y se avisa al alumno; el día queda bloqueado completo, sin huecos sueltos.
  function toggleDiaEntero(date){
    const todoBloqueado=AVAIL_HOURS.every(h=>isBlocked(date,h));
    if(todoBloqueado){
      lastEdit.current=Date.now();
      setBlocked(prev=>{const n={...prev};AVAIL_HOURS.forEach(h=>{delete n[`${viewProf}_${date}_${h}`];});return n;});
      setSaved(false);
      return;
    }
    const afectadas=clasesQueChocan([date],AVAIL_HOURS);
    if(afectadas.length){
      const lista=afectadas.slice(0,10).map(b=>{
        const stu=(students||[]).find(x=>x.id===b[0].studentId);
        return `• ${horasBloque(b)}  ${stu?stu.name:'(alumno)'}`;
      }).join('\n');
      if(!window.confirm(
        `Bloquear el día entero afecta a ${afectadas.length} clase(s):\n\n${lista}` +
        (afectadas.length>10?`\n… y ${afectadas.length-10} más`:'') +
        `\n\nSe CANCELARÁN y se avisará a cada alumno por WhatsApp.\n\n¿Continuar?`)) return;
      cancelaBloques(afectadas);
    }
    lastEdit.current=Date.now();
    setBlocked(prev=>{
      const n={...prev};
      AVAIL_HOURS.forEach(h=>{n[`${viewProf}_${date}_${h}`]={profId:viewProf,date,hour:h,blockedAt:Date.now()};});
      return n;
    });
    setSaved(false);
  }
  function hasSlotBooked(date,hour){
    if(!slots) return false;
    const arr=Array.isArray(slots)?slots:Object.values(slots);
    return arr.some(s=>s.profId===viewProf&&s.date===date&&s.time===hour&&s.studentId&&s.status!=='cancelled');
  }

  const [cloudErr,setCloudErr]=useState('');

  // ── Push instantáneo: cada cambio de disponibilidad/bloqueo sube solo (~1.5s) ──
  const cloudTimer=useRef(null);
  const firstRun=useRef(true);
  function buildCloudRows(){
    // Admin sube todos los profesores; profesor solo lo suyo (el servidor lo fuerza igualmente)
    const profIds=isAdmin?Object.keys(avail):[viewProf];
    const availRows=[];
    profIds.forEach(pid=>{
      Object.entries(avail[pid]||{}).forEach(([dk,hours])=>{
        if(['lun','mar','mie','jue','vie','sab'].includes(dk))
          availRows.push({prof_id:pid,day_key:dk,hours:hours||[]});
      });
    });
    const blockedRows=Object.values(blocked)
      .filter(b=>b&&b.profId&&b.date&&b.hour&&(isAdmin||b.profId===viewProf))
      .map(b=>({prof_id:b.profId,date:b.date,hour:b.hour}));
    return {availRows,blockedRows};
  }
  useEffect(()=>{
    if(firstRun.current){firstRun.current=false;return;}
    if(fromPull.current){fromPull.current=false;return;} // vino de la nube: no re-subir
    const sb=getSupabase();
    const token=sessionStorage.getItem('crm_token');
    if(!sb||!token)return;
    clearTimeout(cloudTimer.current);
    cloudTimer.current=setTimeout(async()=>{
      const {availRows,blockedRows}=buildCloudRows();
      try{
        const {error}=await sb.rpc('crm_save_data',{
          p_token:token,p_availability:availRows,p_blocked:blockedRows,
        });
        if(error)throw error;
        setCloudErr('');
      }catch(e){
        setCloudErr('No se pudo subir a la nube: '+(e.message||'error'));
      }
    },1500);
    return()=>clearTimeout(cloudTimer.current);
  },[avail,blocked]);

  async function handleSave(){
    save('crm_avail_v1',avail);
    save('crm_blocked_v1',blocked);
    setSaved(true);setCloudErr('');
    setTimeout(()=>setSaved(false),2500);
    // Empujar a Supabase inmediatamente (el bot lee la disponibilidad desde allí)
    const sb=getSupabase();
    const token=sessionStorage.getItem('crm_token');
    if(sb&&token){
      clearTimeout(cloudTimer.current); // cancelar el push pendiente: este lo cubre
      const {availRows,blockedRows}=buildCloudRows();
      try{
        const {error}=await sb.rpc('crm_save_data',{
          p_token:token,
          p_availability:availRows,
          p_blocked:blockedRows,
        });
        if(error)throw error;
      }catch(e){
        setCloudErr('No se pudo subir a la nube: '+(e.message||'error'));
      }
    }
  }

  const profAvail=avail[viewProf]||{};
  const totalHours=Object.values(profAvail).flat().length;
  const totalBlocked=Object.keys(blocked).filter(k=>k.startsWith(viewProf)).length;

  return(
    <div style={{height:'100%',overflow:'auto',padding:24}}>
      <div style={{maxWidth:960,margin:'0 auto'}}>

        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
          <div>
            <h1 style={{fontSize:20,fontWeight:700,color:'#091426'}}>
              {isAdmin?'Disponibilidad de profesores':'Mi disponibilidad'}
            </h1>
            <p style={{fontSize:13,color:'#64748b',marginTop:3}}>
              Gestiona los horarios disponibles y bloquea huecos para la semana siguiente
            </p>
          </div>
          <div style={{textAlign:'right'}}>
            <button onClick={handleSave}
              style={{display:'flex',alignItems:'center',gap:6,padding:'9px 18px',borderRadius:8,
                fontSize:13,fontWeight:600,cursor:'pointer',border:'none',
                background:saved?'#16a34a':'#fd761a',color:'#fff',transition:'background .3s'}}>
              <Icon name={saved?'check_circle':'save'} size={16}/>
              {saved?'¡Guardado!':'Guardar cambios'}
            </button>
            {cloudErr&&<p style={{fontSize:11,color:'#dc2626',marginTop:5,maxWidth:220}}>{cloudErr}</p>}
          </div>
        </div>

        {/* Selector de profesor (solo admin) */}
        {isAdmin&&(
          <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
            {professors.map(p=>(
              <button key={p.id} onClick={()=>setSelProf(p.id)}
                style={{display:'flex',alignItems:'center',gap:8,padding:'8px 16px',borderRadius:8,
                  fontSize:13,fontWeight:600,cursor:'pointer',border:'2px solid',transition:'all .15s',
                  borderColor:selProf===p.id?p.color:'#e2e8f0',
                  background:selProf===p.id?p.color+'18':'#fff',
                  color:selProf===p.id?p.color:'#64748b'}}>
                <Avatar name={p.name} color={p.color} size={22}/>{p.name}
              </button>
            ))}
          </div>
        )}

        {/* Tabs */}
        <div style={{display:'flex',gap:4,marginBottom:20,borderBottom:'2px solid #e2e8f0',paddingBottom:0}}>
          {[{id:'disponibilidad',icon:'schedule',label:`Horario habitual (${totalHours}h/sem)`},
            {id:'bloquear',icon:'block',label:`Bloquear semana siguiente${totalBlocked>0?` (${totalBlocked} bloqueadas)`:''}`},
            ...(isAdmin?[{id:'pista',icon:'fence',label:'Horario de pista'}]:[])
          ].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)}
              style={{display:'flex',alignItems:'center',gap:6,padding:'8px 16px',fontSize:13,fontWeight:600,
                cursor:'pointer',border:'none',background:'transparent',transition:'all .15s',
                color:tab===t.id?'#fd761a':'#64748b',
                borderBottom:tab===t.id?'2px solid #fd761a':'2px solid transparent',
                marginBottom:-2}}>
              <Icon name={t.icon} size={16}/>{t.label}
            </button>
          ))}
        </div>

        {/* ── TAB 1: Disponibilidad habitual ── */}
        {tab==='disponibilidad'&&(
          <>
            <div style={{display:'flex',gap:12,marginBottom:16,flexWrap:'wrap'}}>
              <div style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:10,padding:'10px 16px',flex:1,minWidth:120}}>
                <div style={{fontSize:22,fontWeight:700,color:prof?.color||'#fd761a'}}>{totalHours}</div>
                <div style={{fontSize:11,color:'#64748b'}}>horas/semana</div>
              </div>
              {AVAIL_DAYS.map(d=>{
                const hrs=(profAvail[d.key]||[]).length;
                return(
                  <div key={d.key} style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:10,
                    padding:'10px 14px',minWidth:72,textAlign:'center'}}>
                    <div style={{fontSize:15,fontWeight:700,color:hrs>0?'#091426':'#cbd5e1'}}>{hrs}</div>
                    <div style={{fontSize:11,color:'#94a3b8'}}>{d.label}</div>
                  </div>
                );
              })}
            </div>
            <div className="avail-scroll" style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:12,overflow:'hidden'}}>
              <div className="avail-grid">
              <div style={{display:'grid',gridTemplateColumns:'72px repeat(6,1fr)',background:'#f8f9ff',borderBottom:'1px solid #e2e8f0'}}>
                <div style={{padding:'10px 10px',fontSize:10,color:'#94a3b8',fontWeight:600}}>HORA</div>
                {AVAIL_DAYS.map(d=>{
                  const allOn=(profAvail[d.key]||[]).length===AVAIL_HOURS.length;
                  const someOn=(profAvail[d.key]||[]).length>0;
                  return(
                    <div key={d.key} style={{padding:'7px 4px',textAlign:'center',borderLeft:'1px solid #e2e8f0'}}>
                      <div style={{fontSize:11,fontWeight:600,color:'#091426',marginBottom:3}}>{d.label}</div>
                      <button onClick={()=>setDay(d.key,!allOn)}
                        style={{fontSize:10,padding:'2px 6px',borderRadius:4,border:'1px solid',cursor:'pointer',fontWeight:600,
                          borderColor:someOn?(prof?.color||'#fd761a'):'#e2e8f0',
                          background:allOn?(prof?.color||'#fd761a'):someOn?(prof?.color||'#fd761a')+'15':'#f8f9ff',
                          color:allOn?'#fff':someOn?(prof?.color||'#fd761a'):'#94a3b8'}}>
                        {allOn?'Todo ✓':someOn?'Parcial':'Todo'}
                      </button>
                    </div>
                  );
                })}
              </div>
              {AVAIL_HOURS.map((hour,hi)=>(
                <div key={hour} style={{display:'grid',gridTemplateColumns:'72px repeat(6,1fr)',
                  borderBottom:hi<AVAIL_HOURS.length-1?'1px solid #f1f5f9':'none',
                  background:hi%2===0?'#fff':'#fafbff'}}>
                  <div style={{padding:'8px 10px',fontSize:12,fontWeight:500,color:'#64748b',display:'flex',alignItems:'center'}}>{hour}</div>
                  {AVAIL_DAYS.map(d=>{
                    const active=(profAvail[d.key]||[]).includes(hour);
                    return(
                      <div key={d.key} style={{borderLeft:'1px solid #f1f5f9',padding:3,display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <button onClick={()=>toggle(d.key,hour)}
                          style={{width:'100%',height:32,borderRadius:6,border:'2px solid',cursor:'pointer',transition:'all .15s',fontWeight:600,fontSize:11,
                            borderColor:active?(prof?.color||'#fd761a'):'#e2e8f0',
                            background:active?(prof?.color||'#fd761a'):'transparent',
                            color:active?'#fff':'#cbd5e1'}}>
                          {active?'✓':''}
                        </button>
                      </div>
                    );
                  })}
                </div>
              ))}
              </div>
            </div>
            <p style={{fontSize:12,color:'#94a3b8',marginTop:10,textAlign:'center'}}>
              <Icon name="info" size={13}/> Este horario se repite cada semana. Para bloquear horas puntuales usa la pestaña "Bloquear semana siguiente".
            </p>
          </>
        )}

        {/* ── TAB 2: Bloquear semana siguiente ── */}
        {tab==='bloquear'&&(
          <>
            <div style={{background:'#fff3cd',border:'1px solid #ffc107',borderRadius:10,padding:'10px 16px',
              marginBottom:16,display:'flex',alignItems:'center',gap:8,fontSize:13,color:'#856404'}}>
              <Icon name="warning" size={16}/>
              Las horas marcadas como <strong>bloqueadas</strong> no estarán disponibles para reservar la semana siguiente.
              Las horas que ya tienen alumno salen en gris: si las bloqueas, se avisa al alumno por WhatsApp de que su clase queda cancelada.
            </div>
            {/* Bloqueo por rango: evita ir casilla por casilla (60 por día) */}
            <div style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:12,padding:'12px 16px',
              marginBottom:14,display:'flex',alignItems:'flex-end',gap:10,flexWrap:'wrap'}}>
              <div>
                <div style={{fontSize:10,color:'#94a3b8',fontWeight:700,marginBottom:3}}>DÍA</div>
                <select className={inp} style={{width:150}} value={rangoDia} onChange={e=>setRangoDia(e.target.value)}>
                  <option value="todos">Toda la semana</option>
                  {nextWeek.map(wd=><option key={wd.date} value={wd.date}>{wd.label} {wd.date.slice(8)}</option>)}
                </select>
              </div>
              <div>
                <div style={{fontSize:10,color:'#94a3b8',fontWeight:700,marginBottom:3}}>DESDE</div>
                <select className={inp} style={{width:96}} value={rangoIni} onChange={e=>setRangoIni(e.target.value)}>
                  {AVAIL_HOURS.map(h=><option key={h} value={h}>{h}</option>)}
                </select>
              </div>
              <div>
                <div style={{fontSize:10,color:'#94a3b8',fontWeight:700,marginBottom:3}}>HASTA</div>
                <select className={inp} style={{width:96}} value={rangoFin} onChange={e=>setRangoFin(e.target.value)}>
                  {AVAIL_HOURS.map(h=><option key={h} value={h}>{h}</option>)}
                </select>
              </div>
              <button onClick={()=>aplicarRango(true)}
                style={{padding:'8px 14px',borderRadius:8,border:'none',background:'#ef4444',color:'#fff',
                  fontSize:13,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
                <Icon name="block" size={16}/>Bloquear rango
              </button>
              <button onClick={()=>aplicarRango(false)}
                style={{padding:'8px 14px',borderRadius:8,border:'1px solid #e2e8f0',background:'#fff',color:'#475569',
                  fontSize:13,fontWeight:600,cursor:'pointer'}}>
                Desbloquear
              </button>
              <div style={{flex:1}}/>
              <button onClick={()=>setMasivasOpen(true)}
                style={{padding:'8px 14px',borderRadius:8,border:'1px solid #cbd5e1',background:'#f8fafc',color:'#16283f',
                  fontSize:13,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>

              </button>
              <div style={{fontSize:11,color:'#94a3b8',flex:'1 0 100%'}}>
                El <strong>hasta</strong> es la hora a la que vuelve: de 09:00 a 15:00 deja libre la clase de las 15:00.

            {masivasOpen&&(
            <div onClick={e=>{if(e.target===e.currentTarget)setMasivasOpen(false);}}

                <div style={{padding:'16px 22px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px 18px'}}>

                    <div style={lbl}>QUÉ HACER</div>

                  </div>
                  <div>
                    <div style={lbl}>A QUIÉN AFECTA</div>
                    <select className={inp} style={{width:'100%'}} value={mQuien} onChange={e=>setMQuien(e.target.value)}

                        <option key={p.id} value={p.id}>{p.name}</option>)}

                  </div>
                  <div>
                    <div style={lbl}>DESDE EL DÍA *</div>
                    <input type="date" className={inp} style={{width:'100%'}}

                  <div>
                    <div style={lbl}>HASTA EL DÍA *</div>

                  <div>

                  <div>
                    <div style={lbl}>HASTA LA HORA *</div>
                    <select className={inp} style={{width:'100%'}} value={mHastaHora} onChange={e=>setMHastaHora(e.target.value)}>

                    <div style={{fontSize:11,color:'#94a3b8',marginTop:3}}>Es la hora a la que vuelve: queda libre.</div>

                  <div style={{gridColumn:'1 / -1'}}>
                    <div style={lbl}>DÍAS DE LA SEMANA</div>
                    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                      {DIAS_SEMANA.map(([nombre,dow])=>{
                        const on=mDias.includes(dow);
                        return(
                        <button key={dow} onClick={()=>setMDias(prev=>on?prev.filter(d=>d!==dow):[...prev,dow])}
                          style={{padding:'6px 12px',borderRadius:20,fontSize:12.5,fontWeight:on?700:500,cursor:'pointer',
                            border:`1px solid ${on?'#16283f':'#e2e8f0'}`,
                            background:on?'#16283f':'#f8fafc',color:on?'#fff':'#475569'}}>
