                        </button>);
                      })}
                    </div>
                    <div style={{fontSize:11,color:'#94a3b8',marginTop:5}}>
                      Si no marcas ninguno, se aplica a todos los días del rango.
                    </div>
                  </div>
                  {(()=>{ // resumen de lo que va a pasar, antes de tocar nada
                    const dias=fechasDelRango(mDesdeDia,mHastaDia,mDias);
                    const horas=horasDelRango(mDesdeHora,mHastaHora);
                    const nProf=profesoresAfectados().length;
                    const clases=mAccion==='bloquear'&&dias.length&&horas.length
                      ? clasesQueChocan(dias,horas,profesoresAfectados()) : [];
                    return(
                    <div style={{gridColumn:'1 / -1',background:'#f8fafc',border:'1px solid #e2e8f0',
                      borderRadius:10,padding:'10px 13px',fontSize:12.5,color:'#475569'}}>
                      {!dias.length||!horas.length
                        ? <span style={{color:'#c23c30'}}>Ese rango no incluye ningún día u hora. Revisa las fechas.</span>
                        : <>
                            <strong>{dias.length}</strong> día(s) × <strong>{horas.length}</strong> casilla(s) de 15 min
                            × <strong>{nProf}</strong> profesor(es).
                            {mAccion==='bloquear'&&(clases.length
                              ? <div style={{color:'#c23c30',marginTop:4,fontWeight:600}}>
                                  ⚠️ Hay {clases.length} clase(s) con alumno dentro: se cancelarán y se les avisará por WhatsApp.
                                </div>
                              : <div style={{color:'#0e6856',marginTop:4}}>No hay ninguna clase dentro.</div>)}
                          </>}
                    </div>);
                  })()}
                </div>

                <div style={{padding:'0 22px 18px',display:'flex',justifyContent:'flex-end',gap:10}}>
                  <button onClick={()=>setMasivasOpen(false)}
                    style={{padding:'9px 16px',borderRadius:8,border:'1px solid #e2e8f0',background:'#fff',
                      color:'#475569',fontSize:13,fontWeight:600,cursor:'pointer'}}>Cancelar</button>
                  <button onClick={aplicarMasivas} disabled={mAplicando}
                    style={{padding:'9px 18px',borderRadius:8,border:'none',
                      background:mAplicando?'#94a3b8':(mAccion==='bloquear'?'#ef4444':'#0e6856'),
                      color:'#fff',fontSize:13,fontWeight:700,cursor:mAplicando?'default':'pointer'}}>
                    {mAplicando?'Aplicando…':'Aplicar y guardar'}
                  </button>
                </div>
              </div>
            </div>)}
            <div className="avail-scroll" style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:12,overflow:'hidden'}}>
              <div className="avail-grid">
              <div style={{display:'grid',gridTemplateColumns:'72px repeat(6,1fr)',background:'#f8f9ff',borderBottom:'1px solid #e2e8f0'}}>
                <div style={{padding:'10px 10px',fontSize:10,color:'#94a3b8',fontWeight:600}}>HORA</div>
                {nextWeek.map(wd=>{
                  const diaBloqueado=AVAIL_HOURS.every(h=>isBlocked(wd.date,h));
                  return(
                  <div key={wd.date} onClick={()=>toggleDiaEntero(wd.date)}
                    title={diaBloqueado?'Pulsa para desbloquear el día entero':'Pulsa para bloquear el día entero'}
                    style={{padding:'7px 4px',textAlign:'center',borderLeft:'1px solid #e2e8f0',cursor:'pointer',
                      background:diaBloqueado?'#fee2e2':'transparent'}}>
                    <div style={{fontSize:11,fontWeight:600,color:diaBloqueado?'#ef4444':'#091426'}}>
                      {diaBloqueado?'🚫 ':''}{wd.label}
                    </div>
                    <div style={{fontSize:10,color:'#94a3b8'}}>{wd.date.slice(5).replace('-','/')}</div>
                  </div>
                  );
                })}
              </div>
              {AVAIL_HOURS.map((hour,hi)=>(
                <div key={hour} style={{display:'grid',gridTemplateColumns:'72px repeat(6,1fr)',
                  borderBottom:hi<AVAIL_HOURS.length-1?'1px solid #f1f5f9':'none',
                  background:hi%2===0?'#fff':'#fafbff'}}>
                  <div style={{padding:'8px 10px',fontSize:12,fontWeight:500,color:'#64748b',display:'flex',alignItems:'center'}}>{hour}</div>
                  {nextWeek.map(wd=>{
                    const booked=hasSlotBooked(wd.date,hour);
                    const blk=isBlocked(wd.date,hour);
                    return(
                      <div key={wd.date} style={{borderLeft:'1px solid #f1f5f9',padding:3,display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <button onClick={()=>toggleBlock(wd.date,hour)}
                          title={booked?'Hora con alumno: al bloquearla se cancela y se le avisa'
                                :blk?'Click para desbloquear':'Click para bloquear'}
                          style={{width:'100%',height:32,borderRadius:6,border:'2px solid',
                            cursor:booked?'not-allowed':'pointer',transition:'all .15s',fontWeight:700,fontSize:10,
                            borderColor:booked?'#e2e8f0':blk?'#ef4444':'#e2e8f0',
                            background:booked?'#f1f5f9':blk?'#fee2e2':'transparent',
                            color:booked?'#cbd5e1':blk?'#ef4444':'#cbd5e1'}}>
                          {booked?'📅':blk?'🚫':''}
                        </button>
                      </div>
                    );
                  })}
                </div>
              ))}
              </div>
            </div>
            <div style={{display:'flex',gap:16,marginTop:10,justifyContent:'center',fontSize:12,color:'#64748b'}}>
              <span>📅 Reservado por alumno</span>
              <span style={{color:'#ef4444'}}>🚫 Bloqueado (bot no ofrecerá)</span>
              <span style={{color:'#94a3b8'}}>□ Libre</span>
            </div>
          </>
        )}

        {/* ── TAB 3: Horario de pista (solo admin) ── */}
        {tab==='pista'&&isAdmin&&(
          <>
            <div style={{background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:10,padding:'10px 16px',
              marginBottom:16,display:'flex',alignItems:'center',gap:8,fontSize:13,color:'#9a3412'}}>
              <Icon name="fence" size={16}/>
              Marca las horas en que la <strong>pista (circuito)</strong> está disponible. El bot solo
              ofrecerá pista a los alumnos en fase Pista dentro de estas horas. Los de Circulación no
              tienen esta restricción. Se guarda en la nube al instante.
              {pistaMsg&&<span style={{marginLeft:'auto',fontWeight:700}}>{pistaMsg}</span>}
            </div>
            <div className="avail-scroll" style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:12,overflow:'hidden'}}>
              <div className="avail-grid">
              <div style={{display:'grid',gridTemplateColumns:'72px repeat(6,1fr)',background:'#fff7ed',borderBottom:'1px solid #e2e8f0'}}>
                <div style={{padding:'10px 10px',fontSize:10,color:'#94a3b8',fontWeight:600}}>HORA</div>
                {AVAIL_DAYS.map(d=>{
                  const cnt=(pistaHrs[d.key]||[]).length;
                  return(
                    <div key={d.key} style={{padding:'7px 4px',textAlign:'center',borderLeft:'1px solid #e2e8f0'}}>
                      <div style={{fontSize:11,fontWeight:600,color:'#091426'}}>{d.label}</div>
                      <div style={{fontSize:10,color:cnt?'#c2410c':'#cbd5e1'}}>{cnt} h</div>
                    </div>
                  );
                })}
              </div>
              {AVAIL_HOURS.map((hour,hi)=>(
                <div key={hour} style={{display:'grid',gridTemplateColumns:'72px repeat(6,1fr)',
                  borderBottom:hi<AVAIL_HOURS.length-1?'1px solid #f1f5f9':'none',
                  background:hi%2===0?'#fff':'#fffaf5'}}>
                  <div style={{padding:'8px 10px',fontSize:12,fontWeight:500,color:'#64748b',display:'flex',alignItems:'center'}}>{hour}</div>
                  {AVAIL_DAYS.map(d=>{
                    const on=(pistaHrs[d.key]||[]).includes(hour);
                    return(
                      <div key={d.key} style={{borderLeft:'1px solid #f1f5f9',padding:3,display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <button onClick={()=>togglePista(d.key,hour)}
                          style={{width:'100%',height:32,borderRadius:6,border:'2px solid',cursor:'pointer',transition:'all .15s',fontWeight:700,fontSize:11,
                            borderColor:on?'#ea580c':'#e2e8f0',background:on?'#ea580c':'transparent',color:on?'#fff':'#cbd5e1'}}>
                          {on?'✓':''}
                        </button>
                      </div>
                    );
                  })}
                </div>
              ))}
              </div>
            </div>
            <p style={{fontSize:12,color:'#94a3b8',marginTop:10,textAlign:'center'}}>
              <Icon name="info" size={13}/> Si no marcas ninguna hora, la pista no tendrá restricción (el bot ofrecerá pista en el horario normal del profesor).
            </p>
          </>
        )}

      </div>
    </div>
  );
}

// ─── BOT SYNC ─────────────────────────────────────────────────────────────────
// Convierte slot del bot (array item) a formato CRM (object key)
// ─── CONFIGURACIÓN ───────────────────────────────────────────────────────────
function Configuracion({professors,students,setStudents,setSlots,setExamDays,schoolConfig,setSchoolConfig,onSyncSupabase,onLoadSupabase}){
  const [school,setSchool]=useState({...schoolConfig});
  const [passwords,setPasswords]=useState(loadPasswords());
  const [saved,setSaved]=useState(false);
  const [confirmReset,setConfirmReset]=useState(false);
  const [supaStatus,setSupaStatus]=useState(null); // null | 'testing' | 'ok' | 'error'
  const [supaMsg,setSupaMsg]=useState('');
  const [syncing,setSyncing]=useState(false);
  const [syncMsg,setSyncMsg]=useState('');

  const userList=[
    {id:'admin',name:'Administrador'},
    ...professors.filter(p=>p.active!==false).map(p=>({id:p.id,name:p.name}))
  ];

  const handleSaveSchool=()=>{
    saveSchool(school);
    setSchoolConfig(school);
    resetSupabase();
    setSaved(true);
    setTimeout(()=>setSaved(false),2500);
  };

  const handleTestSupabase=async()=>{
    setSupaStatus('testing');setSupaMsg('');
    // Temporarily save current values to test them
    const tmp={...loadSchool(),supabaseUrl:school.supabaseUrl,supabaseAnonKey:school.supabaseAnonKey};
    saveSchool(tmp);resetSupabase();
    const sb=getSupabase();
    if(!sb){setSupaStatus('error');setSupaMsg('Credenciales incompletas');saveSchool(loadSchool());resetSupabase();return;}
    try{
      const {error}=await sb.from('schools').select('id').limit(1);
      if(error)throw error;
      setSupaStatus('ok');setSupaMsg('Conectado correctamente');
    }catch(e){
      setSupaStatus('error');setSupaMsg(e.message||'Error de conexión');
    }
  };

  const handleSyncSupabase=async()=>{
    setSyncing(true);setSyncMsg('');
    try{
      await onSyncSupabase();
      setSyncMsg('✅ Datos subidos a Supabase');
    }catch(e){
      setSyncMsg('❌ Error: '+(e.message||'desconocido'));
    }finally{
      setSyncing(false);
    }
  };

  const [loading,setLoading]=useState(false);
  const handleLoadSupabase=async()=>{
    if(!confirm('Esto reemplazará los datos locales con los de Supabase. ¿Continuar?'))return;
    setLoading(true);setSyncMsg('');
    try{
      const r=await onLoadSupabase();
      setSyncMsg(`✅ Cargados: ${r.profesores} profesores, ${r.alumnos} alumnos, ${r.clases} clases — recargando…`);
      setTimeout(()=>window.location.reload(),1400);
    }catch(e){
      setSyncMsg('❌ Error: '+(e.message||'desconocido'));
    }finally{
      setLoading(false);
    }
  };

  const handlePassChange=(userId,val)=>{
    const next={...passwords,[userId]:val};
    setPasswords(next);
    savePasswords(next);
  };

  // ── Contraseñas en Supabase ──
  const supaActive=!!getSupabase();
  const [adminPwd,setAdminPwd]=useState('');
  const [newPwds,setNewPwds]=useState({});
  const [pwdMsg,setPwdMsg]=useState('');
  const [savingPwd,setSavingPwd]=useState(null);
  const handleSavePwdSupa=async(u)=>{
    const np=(newPwds[u.id]||'').trim();
    if(!np){setPwdMsg('Escribe primero la contraseña nueva');return;}
    if(!adminPwd){setPwdMsg('Introduce tu contraseña de administrador (arriba)');return;}
    const sb=getSupabase();
    setSavingPwd(u.id);setPwdMsg('');
    try{
      const {data,error}=await sb.rpc('admin_set_password',{
        p_admin_id:'admin',
        p_admin_password:adminPwd,
        p_target_user:u.id,
        p_new_password:np,
        p_target_name:u.name,
        p_target_role:u.id==='admin'?'admin':'professor',
      });
      if(error)throw error;
      if(data===true){
        setPwdMsg(`✅ Contraseña de ${u.name} actualizada en Supabase`);
        setNewPwds(s=>({...s,[u.id]:''}));
      } else {
        setPwdMsg('❌ Contraseña de administrador incorrecta');
      }
    }catch(e){
      setPwdMsg('❌ Error: '+(e.message||'desconocido'));
    }finally{
      setSavingPwd(null);
    }
  };

  const handleResetDemo=()=>{
    ['crm_students_v3','crm_slots_v4','crm_exam_days_v3','crm_passwords_v1','crm_avail_v1','crm_blocked_v1'].forEach(k=>localStorage.removeItem(k));
    setStudents([]);
    setSlots({});
    setExamDays([]);
    setPasswords(DEFAULT_PASSWORDS);
    setConfirmReset(false);
    alert('Datos limpiados. Ahora puedes añadir los alumnos y profesores reales.');
  };

  const COLORS=['#fd761a','#1e3a5f','#7c2d8c','#0e6856','#b45309','#b91c1c','#0369a1','#374151'];

  return(
    <div style={{padding:24,overflowY:'auto',height:'100%',maxWidth:700}}>
      <SectionTitle>Configuración</SectionTitle>

      {/* ── Datos de la autoescuela ── */}
      <Card style={{padding:24,marginBottom:20}}>
        <div style={{fontWeight:700,fontSize:15,color:'#091426',marginBottom:18,display:'flex',alignItems:'center',gap:8}}>
          <Icon name="business" size={18} style={{color:'#fd761a'}}/>Datos de la autoescuela
        </div>
        <F label="Nombre de la autoescuela">
          <input className={inp} value={school.name||''} onChange={e=>setSchool(s=>({...s,name:e.target.value}))}
            placeholder="AutoEscuela García"/>
        </F>
        <F label="URL del bot WhatsApp">
          <input className={inp} value={school.botUrl||'http://localhost:3002'}
            onChange={e=>setSchool(s=>({...s,botUrl:e.target.value}))}
            placeholder="http://localhost:3002 o https://tu-bot.railway.app"/>
        </F>
        <F label="Supabase URL">
          <input className={inp} value={school.supabaseUrl||''}
            onChange={e=>setSchool(s=>({...s,supabaseUrl:e.target.value}))}
            placeholder="https://xxxx.supabase.co"/>
        </F>
        <F label="Supabase Anon Key">
          <input className={inp} value={school.supabaseAnonKey||''}
            onChange={e=>setSchool(s=>({...s,supabaseAnonKey:e.target.value}))}
            placeholder="eyJhbGci..."/>
        </F>
        <F label="School ID (UUID de Supabase — tabla schools)">
          <input className={inp} value={school.schoolId||''}
            onChange={e=>setSchool(s=>({...s,schoolId:e.target.value}))}
            placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"/>
          <p style={{fontSize:11,color:'#94a3b8',marginTop:4}}>
            Necesario para sincronizar datos. Encuéntralo en Table Editor → schools.
          </p>
        </F>
        {(school.supabaseUrl&&school.supabaseAnonKey)&&(
          <div style={{marginBottom:16}}>
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              <button type="button" onClick={handleTestSupabase} className={btnG}
                disabled={supaStatus==='testing'} style={{opacity:supaStatus==='testing'?.6:1}}>
                <Icon name="cable" size={16}/>
                {supaStatus==='testing'?'Probando...':'Probar conexión'}
              </button>
              {supaStatus==='ok'&&<span style={{fontSize:13,color:'#16a34a',fontWeight:600}}>✅ {supaMsg}</span>}
              {supaStatus==='error'&&<span style={{fontSize:13,color:'#dc2626',fontWeight:600}}>❌ {supaMsg}</span>}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10,marginTop:10,flexWrap:'wrap'}}>
              <button type="button" onClick={handleSyncSupabase} className={btnG}
                disabled={syncing} style={{opacity:syncing?.6:1}}>
                <Icon name="cloud_upload" size={16}/>
                {syncing?'Sincronizando...':'Subir a Supabase'}
              </button>
              <button type="button" onClick={handleLoadSupabase} className={btnG}
                disabled={loading} style={{opacity:loading?.6:1}}>
                <Icon name="cloud_download" size={16}/>
                {loading?'Cargando...':'Cargar desde Supabase'}
              </button>
              {syncMsg&&<span style={{fontSize:12,color:'#475569'}}>{syncMsg}</span>}
            </div>
          </div>
        )}
        <F label="Color principal">
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
            {COLORS.map(c=>(
              <button key={c} type="button" onClick={()=>setSchool(s=>({...s,color:c}))}
                style={{width:32,height:32,borderRadius:8,background:c,border:school.color===c?'3px solid #091426':'2px solid transparent',
                  cursor:'pointer',transition:'transform .1s'}}
                onMouseEnter={e=>e.currentTarget.style.transform='scale(1.15)'}
                onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}/>
            ))}
            <input type="color" value={school.color||'#fd761a'} onChange={e=>setSchool(s=>({...s,color:e.target.value}))}
              style={{width:32,height:32,borderRadius:8,border:'1px solid #e2e8f0',cursor:'pointer',padding:2}}/>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10,marginTop:6}}>
            <div style={{background:school.color||'#fd761a',borderRadius:8,padding:8,display:'flex'}}>
              <Icon name="directions_car" size={18} style={{color:'#fff'}}/>
            </div>
            <span style={{fontSize:13,fontWeight:700,color:school.color||'#fd761a'}}>{school.name||'AutoEscuela'}</span>
            <span style={{fontSize:11,color:'#94a3b8'}}>← previsualización sidebar</span>
          </div>
        </F>
        <button onClick={handleSaveSchool} className={btnO} style={{marginTop:8}}>
          <Icon name={saved?'check_circle':'save'} size={17}/>
          {saved?'¡Guardado!':'Guardar configuración'}
        </button>
      </Card>

      {/* ── Contraseñas ── */}
      <Card style={{padding:24,marginBottom:20}}>
        <div style={{fontWeight:700,fontSize:15,color:'#091426',marginBottom:6,display:'flex',alignItems:'center',gap:8}}>
          <Icon name="lock" size={18} style={{color:'#1e3a5f'}}/>Contraseñas de acceso
          {supaActive&&<span style={{fontSize:10,fontWeight:700,background:'#dcfce7',color:'#166534',
            padding:'2px 8px',borderRadius:10}}>☁️ En Supabase</span>}
        </div>
        {supaActive?(
          <>
            <p style={{fontSize:12,color:'#94a3b8',marginBottom:14}}>
              Las contraseñas se guardan cifradas en Supabase. Para cambiarlas, introduce
              tu contraseña de administrador actual y la nueva de cada usuario.
            </p>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,
              padding:'10px 14px',background:'#fffbeb',border:'1px solid #fde68a',borderRadius:8}}>
              <Icon name="key" size={16} style={{color:'#b45309'}}/>
              <span style={{fontSize:12,fontWeight:600,color:'#92400e',flexShrink:0}}>Tu contraseña de admin:</span>
              <input type="password" className={inp} style={{maxWidth:180}}
                value={adminPwd} onChange={e=>setAdminPwd(e.target.value)}
                placeholder="Contraseña actual"/>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              {userList.map(u=>(
                <div key={u.id} style={{display:'flex',alignItems:'center',gap:12}}>
                  <div style={{width:130,fontSize:13,fontWeight:600,color:'#475569',flexShrink:0}}>
                    {u.name}
                  </div>
                  <input type="text" className={inp} style={{maxWidth:200}}
                    value={newPwds[u.id]||''}
                    onChange={e=>setNewPwds(s=>({...s,[u.id]:e.target.value}))}
                    placeholder="Nueva contraseña"/>
                  <button onClick={()=>handleSavePwdSupa(u)} className={btnG}
                    disabled={savingPwd===u.id} style={{opacity:savingPwd===u.id?.6:1}}>
                    <Icon name="save" size={14}/>
                    {savingPwd===u.id?'Guardando...':'Guardar'}
                  </button>
                </div>
              ))}
            </div>
            {pwdMsg&&<p style={{fontSize:12,marginTop:12,fontWeight:600,
              color:pwdMsg.startsWith('✅')?'#16a34a':'#dc2626'}}>{pwdMsg}</p>}
          </>
        ):(
          <>
            <p style={{fontSize:12,color:'#94a3b8',marginBottom:18}}>
              Modo demo (sin Supabase): las contraseñas se guardan en este navegador.
              Los cambios se guardan al instante. Contraseña por defecto: <strong>1234</strong>
            </p>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              {userList.map(u=>(
                <div key={u.id} style={{display:'flex',alignItems:'center',gap:12}}>
                  <div style={{width:130,fontSize:13,fontWeight:600,color:'#475569',flexShrink:0}}>
                    {u.name}
                  </div>
                  <input type="text" className={inp} style={{maxWidth:200}}
                    value={passwords[u.id]||''}
                    onChange={e=>handlePassChange(u.id,e.target.value)}
                    placeholder="Nueva contraseña"/>
                  <span style={{fontSize:11,color:'#94a3b8'}}>
                    {passwords[u.id]?`${passwords[u.id].length} caracteres`:'Sin contraseña (usa 1234)'}
                  </span>
                </div>
              ))}
            </div>
          </>
        )}
      </Card>

      {/* ── Zona de peligro ── */}
      <Card style={{padding:24,border:'1px solid #fca5a5'}}>
        <div style={{fontWeight:700,fontSize:15,color:'#b91c1c',marginBottom:6,display:'flex',alignItems:'center',gap:8}}>
          <Icon name="warning" size={18} style={{color:'#b91c1c'}}/>Zona de peligro
        </div>
        <p style={{fontSize:13,color:'#475569',marginBottom:16}}>
          Elimina todos los datos de demo (alumnos, clases, exámenes) y deja el sistema limpio para introducir datos reales. Esta acción no se puede deshacer.
        </p>
        {!confirmReset?(
          <button onClick={()=>setConfirmReset(true)} className={btnR}>
            <Icon name="delete_sweep" size={17}/>Limpiar datos de demo
          </button>
        ):(
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <span style={{fontSize:13,color:'#b91c1c',fontWeight:600}}>¿Seguro? Esto borrará TODO.</span>
            <button onClick={handleResetDemo} className={btnR}><Icon name="delete_forever" size={17}/>Sí, limpiar</button>
            <button onClick={()=>setConfirmReset(false)} className={btnG}>Cancelar</button>
          </div>
        )}
      </Card>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(()=>{try{const u=sessionStorage.getItem('crm_u');return u?JSON.parse(u):null}catch{return null}});
  const [page,setPage]=useState('dashboard');
  const [navOpen,setNavOpen]=useState(false);
  // Sello de tiempo: al cambiar, Disponibilidad abre el modal de acciones
  // masivas. Así el botón del Horario lleva ahí directamente, con una sola
  // implementación del modal.
  const [abrirMasivas,setAbrirMasivas]=useState(0);
  const [professors,setProfessors]=useState(()=>load('crm_professors_v3',PROFESSORS));
  const [vehicles,setVehicles]=useState(()=>load('crm_vehicles_v3',VEHICLES));
  // Con Supabase configurado, la nube es la fuente de verdad: no sembrar demo
  const [students,setStudents]=useState(()=>load('crm_students_v3',null)||(getSupabase()?[]:seedStudents()));
  const [slots,setSlots]=useState(()=>{
    const sv=load('crm_slots_v4',null);if(sv)return sv;
    if(getSupabase())return {};
    const st=load('crm_students_v3',null)||seedStudents();return seedSlots(st);
  });
  const [examDays,setExamDays]=useState(()=>load('crm_exam_days_v3',[]));
  const [schoolConfig,setSchoolConfig]=useState(()=>loadSchool());
  const [botUrl,setBotUrl]=useState(()=>schoolConfig.botUrl||load('crm_bot_url','http://localhost:3002'));
  const [botStatus,setBotStatus]=useState('unknown');
  const [lastSync,setLastSync]=useState(null);

  // Reset supabase client whenever school config changes (new credentials)
  useEffect(()=>{ resetSupabase(); },[schoolConfig]);

  // Normalizadores camelCase → snake_case (el servidor pone school_id por sesión)
  const normSlotDB=s=>({
    id:s.id,
    student_id:s.studentId||s.student_id||null,
    prof_id:s.profId||s.prof_id||null,
    vehicle_id:s.vehicleId||s.vehicle_id||null,
    date:s.date,time:s.time,
    duration:s.duration||45,
    slot_type:s.slotType||s.slot_type||s.type||'practica',
    status:s.cancelled?'cancelled':s.confirmed?'confirmed':'pending',
    reminder_sent:!!(s.reminderSent||s.reminder_sent),
    created_by:s.fromBot?'bot':'crm',
    blocked:!!(s.blocked),
  });
  // Recoge disponibilidad, bloqueos y exam desde localStorage
  const collectAvailRows=()=>{
    const availObj=load('crm_avail_v1',{})||{};
    const rows=[];
    Object.entries(availObj).forEach(([profId,days])=>{
      Object.entries(days||{}).forEach(([dk,hours])=>{
        if(['lun','mar','mie','jue','vie','sab'].includes(dk))
          rows.push({prof_id:profId,day_key:dk,hours:hours||[]});
      });
    });
    return rows;
  };
  const collectBlockedRows=()=>Object.values(load('crm_blocked_v1',{})||{})
    .filter(b=>b&&b.profId&&b.date&&b.hour)
    .map(b=>({prof_id:b.profId,date:b.date,hour:b.hour}));

  // Ref de las clases ya sincronizadas (id → JSON), para el diff granular
  const syncedSlots=useRef({});

  // Guardado completo (reemplazo) — usado por el botón "Subir a Supabase"
  const syncToSupabase=async()=>{
    const sb=getSupabase();
    if(!sb)throw new Error('Supabase no configurado');
    const token=sessionStorage.getItem('crm_token');
    if(!token)throw new Error('Cierra sesión y vuelve a entrar para activar la sincronización');
    const studentsArr=load('crm_students_v3',students)||[];
    const slotsArr=Object.values(load('crm_slots_v4',slots)||{});
    const profsArr=load('crm_professors_v3',professors)||[];
    const vehiclesArr=load('crm_vehicles_v3',vehicles)||[];
    const normProf=p=>{
      const vids=(p.vehicleIds&&p.vehicleIds.length)?p.vehicleIds:((p.vehicleId||p.vehicle_id)?[p.vehicleId||p.vehicle_id]:[]);
      return {
        id:p.id,name:p.name,color:p.color||'#1e3a5f',
        phone:p.phone||null,email:p.email||null,active:p.active!==false,
        licenses:p.licenses||[],
        class_mode:p.classMode||p.class_mode||deriveClassMode(p.licenses),
        vehicle_id:vids[0]||null,        // primer coche (compatibilidad)
        vehicle_ids:vids,
        schedule:p.schedule||null,
      };
    };
    const normStu=s=>({
      id:s.id,name:s.name,phone:s.phone||null,
      prof_id:s.profId||s.prof_id||null,
      license:s.license||'B',
      vehicle_type:s.vehicleType||s.vehicle_type||'manual',
      num_clases:s.numClases??s.num_clases??0,
      bono:s.bono||null,
      tasas_pagadas:!!s.tasasPagadas,
      active:s.active!==false,
      bot_active:s.botActive!==false,
      exam_date:s.examDate||s.exam_date||null,
      exam_result:s.examResult||s.exam_result||null,
      fase:s.fase||'pista',
      notes:s.notes||null,
    });
    const normVeh=v=>({id:v.id,name:v.name,plate:v.plate||'',type:v.type||'B'});

    const {data,error}=await sb.rpc('crm_save_data',{
      p_token:token,
      p_professors:profsArr.map(normProf),
      p_students:studentsArr.filter(s=>s.id&&s.name).map(normStu),
      p_vehicles:vehiclesArr.map(normVeh),
      p_slots:slotsArr.filter(s=>s.id&&s.date&&s.time).map(normSlotDB),
      p_availability:collectAvailRows(),
      p_blocked:collectBlockedRows(),
      p_exam_days:load('crm_exam_days_v3',[])||[],
    });
    if(error){
      if((error.message||'').includes('SESION_INVALIDA'))
        throw new Error('Sesión caducada — cierra sesión y vuelve a entrar');
      throw new Error(error.message);
    }
    // Registrar el estado de clases como base del diff granular
    const snap={};
    slotsArr.filter(s=>s.id&&s.date&&s.time).forEach(s=>{snap[s.id]=JSON.stringify(normSlotDB(s));});
    syncedSlots.current=snap;
    return data;
  };

  // Push incremental automático: clases por id (granular, no borra las del
  // bot que aún no conocemos) + resto de tablas por reemplazo (el bot no
  // las escribe). Este es el camino del auto-sync tras cada edición.
  const pushIncremental=async()=>{
    const sb=getSupabase();
    const token=sessionStorage.getItem('crm_token');
    if(!sb||!token)return;
    // ── 1º ALUMNOS / PROFES / VEHÍCULOS ──────────────────────────────
    // Una clase apunta a su alumno y su profesor: deben existir en la nube
    // ANTES de guardar la clase. Si no, la base de datos la rechaza en
    // silencio y al recargar desaparece. Por eso esto va PRIMERO.
    const normProf=p=>{const vids=(p.vehicleIds&&p.vehicleIds.length)?p.vehicleIds:((p.vehicleId||p.vehicle_id)?[p.vehicleId||p.vehicle_id]:[]);return {id:p.id,name:p.name,color:p.color||'#1e3a5f',phone:p.phone||null,email:p.email||null,active:p.active!==false,licenses:p.licenses||[],class_mode:p.classMode||p.class_mode||deriveClassMode(p.licenses),vehicle_id:vids[0]||null,vehicle_ids:vids,schedule:p.schedule||null};};
    const normStu=s=>({id:s.id,name:s.name,phone:s.phone||null,prof_id:s.profId||s.prof_id||null,license:s.license||'B',vehicle_type:s.vehicleType||s.vehicle_type||'manual',num_clases:s.numClases??s.num_clases??0,bono:s.bono||null,tasas_pagadas:!!s.tasasPagadas,active:s.active!==false,bot_active:s.botActive!==false,exam_date:s.examDate||s.exam_date||null,exam_result:s.examResult||s.exam_result||null,fase:s.fase||'pista',notes:s.notes||null});
    const normVeh=v=>({id:v.id,name:v.name,plate:v.plate||'',type:v.type||'B'});
    const {error:eData}=await sb.rpc('crm_save_data',{
      p_token:token,
      p_professors:(professors||[]).map(normProf),
      p_students:(students||[]).filter(s=>s.id&&s.name).map(normStu),
      p_vehicles:(vehicles||[]).map(normVeh),
      p_slots:null, // las clases van por crm_sync_slots
      p_availability:collectAvailRows(),
      p_blocked:collectBlockedRows(),
      p_exam_days:examDays||[],
    });
    if(eData){
      if((eData.message||'').includes('SESION_INVALIDA'))
        throw new Error('Sesión caducada — cierra sesión y vuelve a entrar');
      throw new Error(eData.message);
    }
    // ── 2º CLASES ─────────────────────────────────────────────────────
    const cur={};
    Object.values(slots).filter(s=>s.id&&s.date&&s.time).forEach(s=>{cur[s.id]=normSlotDB(s);});
    const upserts=[];
    Object.entries(cur).forEach(([id,row])=>{
      const j=JSON.stringify(row);
      if(syncedSlots.current[id]!==j)upserts.push(row);
    });
    // Solo se borra lo que el admin ha borrado A PROPÓSITO. Antes se deducía
    // ("estaba en el snapshot y ya no está ⇒ bórralo") y eso se llevaba por
    // delante las reservas que el bot acababa de hacer y que este panel aún no
    // había recibido. Si una clase desaparece del estado local sin que nadie
    // la borre, no se toca la nube: el siguiente pull la devuelve.
    const deleteIds=[...borradosExplicitos].filter(id=>!cur[id]);
    if(upserts.length||deleteIds.length){
      // p_intencional: el servidor solo borra si el panel lo declara. Una
      // pestaña con el código anterior no envía este campo, así que sus
      // borrados se ignoran en vez de llevarse clases por delante.
      const {data,error}=await sb.rpc('crm_sync_slots',
        {p_token:token,p_upserts:upserts,p_delete_ids:deleteIds,p_intencional:true});
      if(error)throw new Error(error.message);
      // Verificación anti-pérdida: si la nube guardó MENOS clases de las que
      // enviamos, alguna se rechazó (alumno o profesor no válido). No la damos
      // por sincronizada: así el panel avisa en vez de perderla en silencio.
      if(data&&typeof data.upserted==='number'&&data.upserted<upserts.length){
        throw new Error('Alguna clase no se pudo guardar. Revisa que tenga alumno y profesor asignados.');
      }
      deleteIds.forEach(id=>borradosExplicitos.delete(id));
      const snap={};Object.entries(cur).forEach(([id,row])=>{snap[id]=JSON.stringify(row);});
      syncedSlots.current=snap;
    }
  };

  const loadFromSupabase=async()=>{
    const sb=getSupabase();
    if(!sb)throw new Error('Supabase no configurado');
    const token=sessionStorage.getItem('crm_token');
    if(!token)throw new Error('Cierra sesión y vuelve a entrar para activar la sincronización');
    const {data,error}=await sb.rpc('crm_load_data',{p_token:token});
    if(error){
      if((error.message||'').includes('SESION_INVALIDA'))
        throw new Error('Sesión caducada — cierra sesión y vuelve a entrar');
      throw new Error(error.message);
    }
    const d=data||{};
    // Espejo exacto de la nube: las colecciones vacías también reemplazan
    // (el usuario ya confirmó que quiere sobrescribir lo local)
    setProfessors((d.professors||[]).map(p=>({
      id:p.id,name:p.name,color:p.color||'#1e3a5f',
      phone:p.phone||'',email:p.email||'',
      avatar:(p.name||'?').slice(0,2).toUpperCase(),active:p.active!==false,
      licenses:p.licenses||[],
      classMode:p.class_mode||deriveClassMode(p.licenses),
      vehicleId:p.vehicle_id||'',
      vehicleIds:p.vehicle_ids||(p.vehicle_id?[p.vehicle_id]:[]),
      schedule:p.schedule||'',
    })));
    setStudents((d.students||[]).map(s=>({
      id:s.id,name:s.name,phone:s.phone||'',profId:s.prof_id,
      license:s.license||'B',vehicleType:s.vehicle_type||'manual',
      numClases:s.num_clases||0,bono:s.bono||'Sin bono',
      tasasPagadas:!!s.tasas_pagadas,active:s.active!==false,
      botActive:s.bot_active!==false,
      fase:s.fase||'pista',notes:s.notes||'',
      examDate:s.exam_date||'',examResult:s.exam_result||null,
    })));
    setVehicles((d.vehicles||[]).map(v=>({id:v.id,name:v.name,plate:v.plate||'',type:v.type||'B'})));
    const nextSlots={};
    (d.slots||[]).forEach(s=>{
      nextSlots[s.id]={
        id:s.id,
        date:String(s.date).slice(0,10),
        time:String(s.time).slice(0,5),
        profId:s.prof_id,studentId:s.student_id||null,
        vehicleId:s.vehicle_id||null,
        slotType:s.slot_type||'practica',
        duration:s.duration||45,
        confirmed:s.status==='confirmed',
        cancelled:s.status==='cancelled',
        fromBot:s.created_by==='bot',
      };
    });
    setSlots(nextSlots);
    // Registrar las clases descargadas como base del diff (evita que una
    // reserva del bot recién bajada se detecte como "nueva del admin")
    const snap={};
    Object.values(nextSlots).forEach(s=>{snap[s.id]=JSON.stringify(normSlotDB(s));});
    syncedSlots.current=snap;
    // Disponibilidad y bloqueos → localStorage (los lee el componente Disponibilidad)
    const availMap={};
    (d.availability||[]).forEach(a=>{
      if(!availMap[a.prof_id])availMap[a.prof_id]={};
      availMap[a.prof_id][a.day_key]=(a.hours||[]).map(h=>String(h).slice(0,5));
    });
    save('crm_avail_v1',availMap);
    const blockedMap={};
    (d.blocked||[]).forEach(b=>{
      const hour=String(b.hour).slice(0,5);
      const date=String(b.date).slice(0,10);
      blockedMap[`${b.prof_id}_${date}_${hour}`]={profId:b.prof_id,date,hour,blockedAt:Date.now()};
    });
    save('crm_blocked_v1',blockedMap);
    // Días de examen
    const examArr=(d.exam_days||[]).map(x=>String(x).slice(0,10));
    save('crm_exam_days_v3',examArr);
    setExamDays(examArr);
    // Horario de pista (nivel escuela)
    save('crm_pista_hours_v1', d.pista_hours&&typeof d.pista_hours==='object'?d.pista_hours:{});
    window.dispatchEvent(new Event('cloud-pull'));
    return {
      profesores:d.professors?.length||0,
      alumnos:d.students?.length||0,
      clases:d.slots?.length||0,
    };
  };

  useEffect(()=>save('crm_professors_v3',professors),[professors]);
  useEffect(()=>save('crm_vehicles_v3',vehicles),[vehicles]);
  useEffect(()=>save('crm_students_v3',students),[students]);
  useEffect(()=>save('crm_slots_v4',slots),[slots]);
  useEffect(()=>save('crm_exam_days_v3',examDays),[examDays]);
  useEffect(()=>save('crm_bot_url',botUrl),[botUrl]);

  // ── Salud del bot ────────────────────────────────────────
  // Los datos ya viajan por Supabase (el bot lee/escribe allí y el CRM
  // hace pull cada 15s); al bot solo se le consulta que esté vivo.
  const syncFromBot=async(url=botUrl)=>{
    if(!url)return;
    try{
      const r=await fetch(`${url}/api/ping`,{signal:AbortSignal.timeout(4000)});
      if(!r.ok)throw new Error('HTTP '+r.status);
      setBotStatus('ok');
      setLastSync(new Date());
    }catch(e){
      setBotStatus('error');
    }
  };

  // Auto-sync cada 15s cuando bot está conectado
  useEffect(()=>{
    if(!user)return;
    syncFromBot();
    const iv=setInterval(()=>syncFromBot(),15000);
    return()=>clearInterval(iv);
  },[user,botUrl]);

  // ── Sincronización bidireccional con Supabase ─────────────────────
  // La nube es la fuente de verdad: al entrar y cada 15s se descarga el
  // estado real (pull). Los cambios locales se suben al momento (push,
  // ver efecto de abajo). Un pull nunca pisa una edición hecha en los
  // últimos 8s (le da tiempo al push a completarse primero).
  const [cloudStatus,setCloudStatus]=useState('off'); // off | ok | error
  const [lastCloudSync,setLastCloudSync]=useState(null);
  const suppressPush=useRef(false);   // el cambio viene de la nube: no re-subirlo
  const lastLocalChange=useRef(0);    // timestamp de la última edición local
  // hay un cambio local que aún no confirmó la nube. Arranca en true si al
  // abrir se detecta que lo que hay en el navegador NO coincide con lo último
  // que se confirmó subido (p.ej. el navegador se cerró/se coló antes de que
  // el push de la última edición llegara a salir): así el primer pull espera
  // a que ese cambio se intente subir en vez de borrarlo con la versión vieja
  // de la nube.
  // Solo aplica a admin: es el único rol que sube cambios, así que es el
  // único que puede tener algo pendiente de confirmar al abrir.
  const pushPending=useRef((()=>{
    try{
      if(!user||user.role!=='admin')return false;
      const lastSynced=localStorage.getItem('crm_last_synced_snapshot')||'';
      const current=JSON.stringify([students,slots,professors,vehicles,examDays]);
      return !!lastSynced&&lastSynced!==current;
    }catch{return false;}
  })());
  useEffect(()=>{
    if(!user)return;
    if(!getSupabase()||!sessionStorage.getItem('crm_token')){setCloudStatus('off');return;}
    let cancelled=false;
    const pull=async()=>{
      // No pisar un cambio que aún no se ha subido (evita perderlo si el pull
      // periódico llega mientras el push sigue reintentando).
      if(pushPending.current||Date.now()-lastLocalChange.current<8000)return;
      try{
        suppressPush.current=true;
        await loadFromSupabase();
        if(!cancelled){
          setCloudStatus('ok');setLastCloudSync(new Date());
          window.dispatchEvent(new Event('cloud-pull'));
          // Renovar la sesión (deslizante 30 días; el servidor lo throttlea)
          const sb=getSupabase(),tk=sessionStorage.getItem('crm_token');
          if(sb&&tk)sb.rpc('touch_session',{p_token:tk}).catch(()=>{});
        }
      }catch(e){
        suppressPush.current=false;
        if(!cancelled){
          // Sesión caducada → al login al instante, sin datos viejos colgados
          if((e.message||'').includes('SESION_INVALIDA')||(e.message||'').includes('caducada')){
            sessionStorage.removeItem('crm_token');
            setCloudStatus('off');
            alert('Tu sesión ha caducado. Vuelve a entrar para ver los datos actualizados.');
            logout();
          } else {
            setCloudStatus('error');
          }
        }
      }
    };
    pull();                              // al entrar: descargar el estado real
    const iv=setInterval(pull,15000);    // espejo de la nube cada 15s
    return()=>{cancelled=true;clearInterval(iv);};
  },[user,schoolConfig]);

  // ── Push instantáneo: cualquier cambio LOCAL se sube a Supabase en ~1.5s ──
  // Si la pestaña se oculta o se va a cerrar con un push pendiente, se manda
  // al momento (sin esperar el debounce) y se avisa antes de salir: evita que
  // un cambio hecho justo antes de recargar/cerrar se pierda en silencio.
  const instantTimer=useRef(null);
  // Arranca con la última confirmación real (persistida), no vacío: así, si
  // el navegador se cerró antes de terminar de subir, el próximo arranque
  // sabe que sigue habiendo un cambio pendiente (ver pushPending arriba).
  const lastPushed=useRef((()=>{try{return localStorage.getItem('crm_last_synced_snapshot')||''}catch{return ''}})());
  const markSynced=snapshot=>{
    lastPushed.current=snapshot;
    pushPending.current=false;
    try{localStorage.setItem('crm_last_synced_snapshot',snapshot);}catch{}
  };
  useEffect(()=>{
    if(!user||user.role!=='admin')return;
    if(!getSupabase()||!sessionStorage.getItem('crm_token'))return;
    const snapshot=JSON.stringify([students,slots,professors,vehicles,examDays]);
    if(suppressPush.current){
      // Este cambio vino del pull de la nube: registrar como base, no re-subir
      suppressPush.current=false;
      markSynced(snapshot);
      return;
    }
    if(snapshot===lastPushed.current){pushPending.current=false;return;} // nada cambió de verdad (p.ej. sync del bot)
    lastLocalChange.current=Date.now();
    pushPending.current=true;
    clearTimeout(instantTimer.current);
    const doPush=async(retry)=>{
      try{
        await pushIncremental();
        markSynced(snapshot);
        setCloudStatus('ok');setLastCloudSync(new Date());
      }catch(e){
        // Sesión caducada: no reintentar ni machacar nada, al login
        if((e.message||'').includes('SESION_INVALIDA')||(e.message||'').includes('caducada')){
          sessionStorage.removeItem('crm_token');
          setCloudStatus('off');
          pushPending.current=false;
          return;
        }
        setCloudStatus('error');
        if(retry>0){
          // Reintentar, pero SIN bloquear la descarga periódica: si la nube está
          // bien (guardó por otra vía), el próximo pull pondrá el estado en verde.
          instantTimer.current=setTimeout(()=>doPush(retry-1),4000);
        } else {
          pushPending.current=false; // se rinde: no bloquear los pulls para siempre
        }
      }
    };
    instantTimer.current=setTimeout(()=>doPush(2),1500);
    // Al ocultar la pestaña (cambio de app, cierre) con un push pendiente:
    // mandarlo ya, sin esperar el debounce de 1.5s.
    const flushNow=()=>{
      if(!pushPending.current)return;
      clearTimeout(instantTimer.current);
      doPush(2);
    };
    const onVisibility=()=>{ if(document.hidden)flushNow(); };
    const onBeforeUnload=e=>{
      if(!pushPending.current)return;
      flushNow();
      e.preventDefault();
      e.returnValue='Hay cambios sin guardar en la nube. Espera un segundo antes de salir.';
      return e.returnValue;
    };
    document.addEventListener('visibilitychange',onVisibility);
    window.addEventListener('pagehide',flushNow);
    window.addEventListener('beforeunload',onBeforeUnload);
    return()=>{
      clearTimeout(instantTimer.current);
      document.removeEventListener('visibilitychange',onVisibility);
      window.removeEventListener('pagehide',flushNow);
      window.removeEventListener('beforeunload',onBeforeUnload);
    };
  },[students,slots,professors,vehicles,examDays,user]);

  // Los cambios de horario viajan a Supabase por el push instantáneo;
  // el bot los lee de allí (ya no se le envían por REST).

  const login=u=>{setUser(u);sessionStorage.setItem('crm_u',JSON.stringify(u));setPage(u.role==='admin'?'dashboard':'horario');};
  const logout=()=>{
    const t=sessionStorage.getItem('crm_token');
    const sb=getSupabase();
    if(t&&sb)sb.rpc('crm_logout',{p_token:t}).catch(()=>{});
    sessionStorage.removeItem('crm_token');
    setUser(null);sessionStorage.removeItem('crm_u');
  };

  if(!user)return <LoginScreen onLogin={login} professors={professors}/>;

  const shared={students,professors,user};
  const pages={
    dashboard:      <Dashboard {...shared} slots={slots}/>,
    alumnos:        <Alumnos {...shared} setStudents={setStudents}/>,
    horario:        <Horario {...shared} slots={slots} setSlots={setSlots} vehicles={vehicles} examDays={examDays} setExamDays={setExamDays}
                      onAccionesMasivas={()=>{setAbrirMasivas(Date.now());setPage('disponibilidad');}}/>,
    disponibilidad: <Disponibilidad {...shared} slots={slots} setSlots={setSlots} abrirMasivas={abrirMasivas}/>,
    profesores:     <Profesores {...shared} vehicles={vehicles} setProfessors={setProfessors}/>,
    vehiculos:      <Vehiculos user={user} vehicles={vehicles} setVehicles={setVehicles}/>,
    mensajes:       <Mensajes {...shared} slots={slots}/>,
    estadisticas:   <Estadisticas {...shared} slots={slots}/>,
    configuracion:  <Configuracion professors={professors} students={students} setStudents={setStudents}
                      setSlots={setSlots} setExamDays={setExamDays}
                      schoolConfig={schoolConfig} setSchoolConfig={setSchoolConfig}
                      onSyncSupabase={syncToSupabase} onLoadSupabase={loadFromSupabase}/>,
  };

  // Indicador de estado del bot en el sidebar
  const botIndicator=(
    <div style={{padding:'8px 14px',borderTop:'1px solid rgba(255,255,255,.07)'}}>
      <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11}}>
        <div style={{width:7,height:7,borderRadius:'50%',flexShrink:0,
          background:botStatus==='ok'?'#22c55e':botStatus==='error'?'#ef4444':'#94a3b8'}}/>
        <span style={{color:botStatus==='ok'?'#4ade80':botStatus==='error'?'#fca5a5':'rgba(255,255,255,.3)',flex:1}}>
          {botStatus==='ok'?`Bot conectado`:botStatus==='error'?'Bot desconectado':'Conectando...'}
        </span>
        {botStatus==='ok'&&<button onClick={()=>syncFromBot()}
          title="Sincronizar ahora"
          style={{background:'none',border:'none',color:'rgba(255,255,255,.3)',cursor:'pointer',padding:2}}>
          <Icon name="sync" size={13}/>
        </button>}
      </div>
      {lastSync&&botStatus==='ok'&&(
        <div style={{fontSize:10,color:'rgba(255,255,255,.2)',marginTop:2,marginLeft:13}}>
          Sync: {lastSync.toLocaleTimeString('es')}
        </div>
      )}
      {botStatus==='error'&&(
        <input value={botUrl} onChange={e=>setBotUrl(e.target.value)}
          onBlur={()=>syncFromBot(botUrl)}
          placeholder="http://localhost:3002"
          style={{marginTop:4,width:'100%',fontSize:10,padding:'3px 6px',borderRadius:4,
            border:'1px solid rgba(255,255,255,.15)',background:'rgba(255,255,255,.07)',
            color:'#fff',outline:'none'}}/>
      )}
      {cloudStatus!=='off'&&(()=>{
        // Sano si guardó/descargó con éxito hace poco (aunque un intento suelto
        // fallara). Solo avisamos si lleva un rato sin sincronizar de verdad.
        const reciente=lastCloudSync&&(Date.now()-lastCloudSync.getTime()<30000);
        const ok=cloudStatus==='ok'||reciente;
        return(
          <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11,marginTop:6}}>
            <div style={{width:7,height:7,borderRadius:'50%',flexShrink:0,
              background:ok?'#38bdf8':'#f59e0b'}}/>
            <span style={{color:ok?'#7dd3fc':'#fcd34d'}}>
              {ok
                ?`Nube${lastCloudSync?' · '+lastCloudSync.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}):''}`
                :'Reconectando…'}
            </span>
          </div>
        );
      })()}
    </div>
  );

  const ac=schoolConfig?.color||'#fd761a';
  const NAV=(user.role==='admin'?NAV_ADMIN:NAV_PROF);
  const currentLabel=(NAV.find(n=>n.id===page)||{}).label||'';

  return(
    <div className="app-shell">
      {/* Barra superior solo en móvil */}
      <div className="mobile-topbar">
        <button onClick={()=>setNavOpen(true)}
          style={{background:'none',border:'none',color:'#fff',display:'flex',cursor:'pointer',padding:4}}>
          <Icon name="menu" size={24}/>
        </button>
        <div style={{background:ac,borderRadius:7,padding:5,display:'flex'}}>
          <Icon name="directions_car" size={16} style={{color:'#fff'}}/>
        </div>
        <span style={{fontWeight:700,fontSize:14,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {currentLabel}
        </span>
        <div style={{width:8,height:8,borderRadius:'50%',
          background:botStatus==='ok'?'#22c55e':botStatus==='error'?'#ef4444':'#94a3b8'}}/>
      </div>

      {/* Overlay para cerrar el cajón */}
      <div className={'mobile-overlay'+(navOpen?' open':'')} onClick={()=>setNavOpen(false)}/>

      {/* Sidebar (cajón deslizante en móvil, fijo en escritorio) */}
      <div className={'sidebar-col'+(navOpen?' open':'')}>
        <Sidebar page={page} setPage={p=>{setPage(p);setNavOpen(false);}} user={user}
          onLogout={logout} professors={professors} schoolConfig={schoolConfig}/>
        {botIndicator}
      </div>

      <main style={{flex:1,overflow:'hidden',position:'relative'}}>
        {pages[page]||pages.dashboard}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
